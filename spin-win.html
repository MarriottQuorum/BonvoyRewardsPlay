<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spin & Win</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  text-align:center;
}

/* HEADER */
.top{
  display:flex;
  justify-content:space-between;
  padding:20px;
}

button{
  background:#111;
  color:#fff;
  border:1px solid #444;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}

/* WHEEL */
.container{
  margin-top:20px;
}

#wheel{
  width:320px;
  height:320px;
  border-radius:50%;
  margin:auto;
  border:6px solid gold;
  position:relative;
  transition: transform 4s cubic-bezier(.2,.8,.2,1);
}

.slice{
  position:absolute;
  width:50%;
  height:50%;
  transform-origin:100% 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  text-align:center;
}

/* CENTER BUTTON */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90px;
  height:90px;
  border-radius:50%;
  background:gold;
  color:#000;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 0 20px gold;
}

/* POINTER */
.pointer{
  width:0;
  height:0;
  border-left:10px solid transparent;
  border-right:10px solid transparent;
  border-bottom:20px solid gold;
  margin:10px auto;
}

/* WINNER */
#winner{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:32px;
}
</style>
</head>

<body>

<div class="top">
  <div>Spin & Win</div>
  <div>
    <button onclick="goHome()">Home</button>
    <button onclick="location.reload()">Reset</button>
    <button onclick="toggleFull()">Full Screen</button>
  </div>
</div>

<div class="pointer"></div>

<div class="container">
  <div id="wheel"></div>
  <div class="center" onclick="spin()">SPIN</div>
</div>

<div id="winner" onclick="closeWinner()"></div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgWcTqPKI2xoPVMrQtN_7UNlDkkrFymRsMLnBNDWByUj6QgKfwq6oJbfYioTDtiuaW6JHJQuWBmwX-/pub?output=csv";

let prizes = [];

async function loadPrizes(){
  try{
    const res = await fetch(sheetURL);
    const text = await res.text();
    prizes = text.split("\n").slice(1).map(r=>r.split(",")[0]).filter(x=>x);
  }catch{
    prizes = ["500 Points","Bar Drink","Free Parking","1,000 Points"];
  }
  buildWheel();
}

function buildWheel(){
  const wheel = document.getElementById("wheel");
  wheel.innerHTML = "";
  const angle = 360 / prizes.length;

  prizes.forEach((p,i)=>{
    const slice = document.createElement("div");
    slice.className="slice";
    slice.style.background = `hsl(${i*50},70%,30%)`;
    slice.style.transform = `rotate(${i*angle}deg) skewY(${90-angle}deg)`;
    slice.innerHTML = `<span style="transform:skewY(-${90-angle}deg) rotate(${angle/2}deg); display:block;">${p}</span>`;
    wheel.appendChild(slice);
  });
}

let spinning=false;

function spin(){
  if(spinning) return;
  spinning=true;

  const wheel = document.getElementById("wheel");
  const spins = Math.floor(Math.random()*360)+1440;

  wheel.style.transform = `rotate(${spins}deg)`;

  setTimeout(()=>{
    const index = Math.floor(Math.random()*prizes.length);
    showWinner(prizes[index]);
    spinning=false;
  },4000);
}

function showWinner(text){
  const w = document.getElementById("winner");
  w.innerHTML = "WINNER<br>"+text;
  w.style.display="flex";

  setTimeout(()=>closeWinner(),5000);
}

function closeWinner(){
  document.getElementById("winner").style.display="none";
}

function goHome(){
  window.location.href="index.html";
}

function toggleFull(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

loadPrizes();
</script>

</body>
</html>
