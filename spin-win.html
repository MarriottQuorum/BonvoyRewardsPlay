<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spin & Win</title>
<style>
:root{--gold:#d4af37;--gold2:#f1df93;--text:#f7f3ea;--muted:#d0c7b7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 10%, rgba(212,175,55,.14), transparent 26%),linear-gradient(180deg,#121212 0%,#040404 100%);overflow:hidden}.screen{min-height:100%;padding:10px;display:grid;place-items:center}.frame{width:min(96vw,820px);height:min(96vh,1480px);border-radius:28px;border:1px solid rgba(212,175,55,.34);box-shadow:0 0 0 2px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.12),inset 0 0 90px rgba(212,175,55,.05);background:radial-gradient(circle at 50% 7%, rgba(212,175,55,.11), transparent 24%),linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),#060606;position:relative;overflow:hidden;padding:14px 14px 18px;display:grid;grid-template-rows:auto 1fr auto}.frame:before{content:'';position:absolute;inset:8px;border-radius:22px;border:1px solid rgba(212,175,55,.18);pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.25em;text-transform:uppercase;font-size:clamp(12px,1.15vw,18px);margin-bottom:4px}.title{margin:0;line-height:.95;letter-spacing:-.04em;font-size:clamp(44px,6.4vw,84px);font-weight:900}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1a1a1a,#0d0d0d);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(14px,1.35vw,22px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}.main{display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;gap:10px}.wheel-panel{width:100%;display:grid;place-items:center;position:relative;padding-top:10px}.pointer{width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 0 10px rgba(212,175,55,.55));margin-bottom:-6px;z-index:5}.wheel-wrap{width:min(86vw,650px);height:min(86vw,650px);position:relative;display:grid;place-items:center}.rotor{width:100%;height:100%;position:relative;border-radius:50%;transition:transform 5.2s cubic-bezier(.16,.88,.18,1)}.wheel{position:absolute;inset:0;border-radius:50%;border:7px solid var(--gold);box-shadow:0 0 28px rgba(212,175,55,.35),inset 0 0 24px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.36);overflow:hidden;background:#111}.wheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 24%, rgba(255,255,255,.18), transparent 24%), radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.22) 100%);pointer-events:none}.dividers{position:absolute;inset:0;border-radius:50%}.divider{position:absolute;left:50%;top:50%;width:2px;height:50%;transform-origin:bottom center;background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(212,175,55,.65) 25%, rgba(0,0,0,0));box-shadow:0 0 8px rgba(255,255,255,.18)}.labels{position:absolute;inset:0}.label{position:absolute;left:50%;top:50%;transform-origin:0 0;width:42%;text-align:right;color:#fff;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.62);font-size:clamp(12px,1.45vw,20px);line-height:1.02;padding-right:18px}.center-spin{position:absolute;width:min(20vw,140px);height:min(20vw,140px);min-width:100px;min-height:100px;border:none;border-radius:50%;cursor:pointer;z-index:6;background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);color:#111;font-size:clamp(22px,4vw,42px);font-weight:900;letter-spacing:-.04em;box-shadow:0 0 28px rgba(212,175,55,.5),inset 0 2px 10px rgba(255,255,255,.48),0 10px 30px rgba(0,0,0,.45)}.status{text-align:center}.mini{color:var(--gold);font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(11px,1vw,16px);margin-bottom:4px}.headline{font-size:clamp(34px,5.7vw,74px);font-weight:900;line-height:.92;margin:0 12px;text-shadow:0 3px 12px rgba(0,0,0,.45)}.sub{color:var(--muted);font-size:clamp(15px,1.8vw,26px);margin-top:10px}.footer{display:grid;justify-items:center;gap:10px;padding-bottom:2px}.footer img{max-width:min(60vw,420px);width:100%;height:auto;opacity:.96}.footer-note{font-size:clamp(12px,1.15vw,18px);color:#d6d0c3;text-align:center}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:28px;z-index:40}.overlay.show{display:flex}.overlay-card{width:min(90%, 920px);border-radius:34px;border:1px solid rgba(212,175,55,.36);background:radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%), linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), #080808;box-shadow:0 0 0 1px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.16);padding:42px 28px;text-align:center;position:relative;overflow:hidden}.overlay-icon{width:92px;height:92px;margin:0 auto 18px;color:var(--gold2)}.winner{font-size:clamp(48px,10vw,142px);font-weight:900;line-height:.88;margin:0;letter-spacing:-.04em;text-shadow:0 0 18px rgba(255,245,200,.18)}.congrats{color:var(--gold2);font-size:clamp(24px,3.1vw,48px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;margin-top:14px}.prize{font-size:clamp(34px,6vw,84px);font-weight:900;line-height:1;margin-top:24px}.returning{color:#ddd5c9;font-size:clamp(18px,2.2vw,30px);margin-top:18px}.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:100}.confetti{position:absolute;top:-20px;width:10px;height:18px;border-radius:3px;opacity:.9;animation:fall linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:.92}} svg{width:100%;height:100%}
</style></head><body>
<div class="screen"><div class="frame"><div class="top"><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title">Spin &amp;<br>Win</h1></div><div class="controls"><button class="btn" id="homeBtn">Home</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="fsBtn">Full Screen</button></div></div><div class="main"><div class="wheel-panel"><div class="pointer"></div><div class="wheel-wrap"><div id="rotor" class="rotor"><div id="wheel" class="wheel"></div><div id="dividers" class="dividers"></div><div id="labels" class="labels"></div></div><button id="spinBtn" class="center-spin">SPIN</button></div></div><div class="status"><div class="mini">Spin &amp; Win</div><div id="headline" class="headline">Tap spin to begin</div><div id="sub" class="sub">Land the prize under the pointer</div></div></div><div class="footer"><img src="BONVOY_LOGO_2C_REV_RGB.png" alt="Marriott Bonvoy"><div id="footerNote" class="footer-note">Ready to play</div></div><div id="overlay" class="overlay"><div class="overlay-card"><div id="overlayIcon" class="overlay-icon"></div><h2 class="winner">WINNER</h2><div class="congrats">Congratulations</div><div id="overlayPrize" class="prize">Prize</div><div class="returning" data-return-text>Returning in 6s</div></div></div></div></div>
<script>
const PRIZE_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";const SETTINGS_KEY='bonvoyRewardsPlaySettingsV2';const DEFAULT_SETTINGS={soundOn:true,popupSeconds:6,afterWinAction:'menu',luckyLoopRandomPath:false};function getSettings(){try{return Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch{return {...DEFAULT_SETTINGS}}}function parseCsvLine(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i],n=line[i+1];if(ch==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){r.push(c.trim());c=''}else c+=ch}r.push(c.trim());return r}function normalize(s){return String(s||'').trim().toLowerCase()}function shortenPrize(label){return String(label).replace(/\bPoints\b/ig,'Pts').replace(/\bBreakfast for Two\b/ig,'Breakfast x2').replace(/\bGift Shop Snack\/Drink\b/ig,'Gift Shop').replace(/\bLate Checkout\b/ig,'Late Check-out').replace(/\s+/g,' ').trim()}function inferIconKey(label){const s=normalize(label);if(s.includes('point'))return'points';if(s.includes('appetizer')||s.includes('dining')||s.includes('dessert'))return'dining';if(s.includes('drink')||s.includes('voucher')||s.includes('bar'))return'drink';if(s.includes('coffee')||s.includes('starbucks'))return'coffee';if(s.includes('breakfast'))return'breakfast';if(s.includes('parking'))return'parking';if(s.includes('club'))return'mclub';if(s.includes('upgrade')||s.includes('suite'))return'upgrade';if(s.includes('gift')||s.includes('snack box'))return'gift';if(s.includes('spin again')||s.includes('double'))return'bonus';if(s.includes('surprise')||s.includes('mystery'))return'surprise';return'star'}function inferAccent(label){const s=normalize(label);if(s.includes('point'))return'blue';if(s.includes('appetizer')||s.includes('dining'))return'teal';if(s.includes('drink')||s.includes('coffee')||s.includes('breakfast')||s.includes('dessert'))return'amber';if(s.includes('parking'))return'emerald';if(s.includes('club')||s.includes('upgrade')||s.includes('suite'))return'gold';if(s.includes('spin again')||s.includes('double'))return'plum';return'blue'}async function loadPrizeMaster(){const fb=['500 Points','Free Appetizer','Late Checkout','Starbucks Drink','Free Parking','Breakfast for Two','2,500 Points','Suite Upgrade','Gift Shop Snack/Drink','Spin Again'].map(label=>({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)}));try{const res=await fetch(PRIZE_CSV,{cache:'no-store'});const txt=await res.text();const lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return fb;const headers=parseCsvLine(lines[0]).map(normalize);const iActive=headers.indexOf('active'),iLabel=headers.indexOf('prize label');const out=[];for(const line of lines.slice(1)){const cols=parseCsvLine(line);const active=iActive>=0?normalize(cols[iActive]):'yes';const label=(cols[iLabel>=0?iLabel:1]||cols[0]||'').trim();if(!label)continue;if(iActive>=0&&!['yes','true','1','y'].includes(active))continue;out.push({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)})}return out.length?out:fb}catch{return fb}}function fullScreenToggle(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}function iconSvg(key){const common='viewBox="0 0 64 64" aria-hidden="true"';const i={points:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="8"/><path d="M16 18v18c0 4.4 7.2 8 16 8s16-3.6 16-8V18"/><path d="M16 27c0 4.4 7.2 8 16 8s16-3.6 16-8"/></g></svg>`,star:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M32 9l6.7 13.6L54 25l-11 10.7 2.6 15.3L32 44l-13.6 7 2.6-15.3L10 25l15.3-2.4z"/></svg>`,gift:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="24" width="40" height="26" rx="4"/><path d="M32 24v26M12 33h40"/><path d="M32 24s-11-2-11-8c0-3 2.4-5 5.4-5 4.2 0 5.6 5.2 5.6 5.2S33.4 11 37.6 11C40.6 11 43 13 43 16c0 6-11 8-11 8z"/></g></svg>`,surprise:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M32 11v14M32 39v14M11 32h14M39 32h14"/><path d="M18 18l6 6M40 40l6 6M46 18l-6 6M24 40l-6 6"/></g></svg>`,dining:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v22M15 10v10M20 20h-5M25 10v10"/><path d="M43 10c4 6 4 12 0 18v26"/><path d="M20 32v22"/></g></svg>`,drink:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h32l-8 14H24z"/><path d="M32 28v16"/><path d="M24 50h16"/><path d="M44 14l6-6"/></g></svg>`,coffee:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 22h26v14a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z"/><path d="M42 25h4a7 7 0 0 1 0 14h-4"/><path d="M22 12c0 4 4 4 4 8M30 12c0 4 4 4 4 8"/></g></svg>`,breakfast:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 42c5-12 27-12 32 0"/><path d="M12 42h40"/><path d="M25 28a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/><path d="M40 30c5 0 8-3.4 8-8"/></g></svg>`,parking:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="10" width="36" height="44" rx="6"/><path d="M25 44V20h11a7 7 0 0 1 0 14H25"/></g></svg>`,mclub:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M12 46h40l-4-24-12 10-8-14-8 14-8-10z"/></svg>`,upgrade:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42l12-20 12 20"/><path d="M32 20v24"/><path d="M48 16l4-4m0 0l4 4m-4-4v12"/></g></svg>`,bonus:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M19 20v10M14 25h10M39 34v10M34 39h10"/><path d="M32 10l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g></svg>`};return i[key]||i.star}function confettiBurst(target){const wrap=document.createElement('div');wrap.className='confetti-wrap';for(let i=0;i<80;i++){const p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.8+Math.random()*1.1)+'s';p.style.background=['#d4af37','#f1df93','#b07a1c','#1d5e90','#1f766a','#7b38a3'][Math.floor(Math.random()*6)];wrap.appendChild(p)}target.appendChild(wrap);setTimeout(()=>wrap.remove(),3400)}function scheduleAfterWin(closeFn){const s=getSettings();let r=Math.max(1,Number(s.popupSeconds)||6);const el=document.querySelector('[data-return-text]');if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`;const t=setInterval(()=>{r--;if(r<=0){clearInterval(t);closeFn()}else if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`},1000);return t}
let prizes=[],display=[],spinning=false,currentRotation=0,segmentAngle=45,winTimer=null;const rotor=document.getElementById('rotor'),wheel=document.getElementById('wheel'),labels=document.getElementById('labels'),dividers=document.getElementById('dividers'),headline=document.getElementById('headline'),sub=document.getElementById('sub'),footerNote=document.getElementById('footerNote'),overlay=document.getElementById('overlay'),overlayIcon=document.getElementById('overlayIcon'),overlayPrize=document.getElementById('overlayPrize');function buildWheel(){const n=display.length;segmentAngle=360/n;const base=['#204f9b','#145d66','#8a5617','#6b2f86','#1b5f49','#a0781e','#2a57a1','#7e4a12'];const parts=[];for(let i=0;i<n;i++)parts.push(`${base[i%8]} ${i*segmentAngle}deg ${(i+1)*segmentAngle}deg`);wheel.style.background=`conic-gradient(from ${-90-segmentAngle/2}deg, ${parts.join(', ')})`;labels.innerHTML='';dividers.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('div');d.className='divider';d.style.transform=`translate(-50%,-100%) rotate(${i*segmentAngle}deg)`;dividers.appendChild(d);const l=document.createElement('div');l.className='label';l.style.transform=`translate(-2%,-50%) rotate(${i*segmentAngle}deg) translateX(12%)`;l.innerHTML=`<div style="transform:rotate(${90+segmentAngle/2}deg)">${shortenPrize(display[i].label)}</div>`;labels.appendChild(l)}}function setTexts(h,s,f){headline.textContent=h;sub.textContent=s;footerNote.textContent=f}function spinWheel(){if(spinning)return;spinning=true;spinBtn.disabled=true;setTexts('Spinning…','Good luck','Wheel in motion');const index=Math.floor(Math.random()*display.length),target=index*segmentAngle+segmentAngle/2,extra=360*6;currentRotation+=extra;const normalized=((currentRotation%360)+360)%360,delta=(360-((target+normalized)%360))%360;currentRotation+=delta;rotor.style.transform=`rotate(${currentRotation}deg)`;const done=()=>{rotor.removeEventListener('transitionend',done);spinning=false;spinBtn.disabled=false;currentRotation%=360;rotor.style.transition='none';rotor.style.transform=`rotate(${currentRotation}deg)`;requestAnimationFrame(()=>rotor.style.transition='transform 5.2s cubic-bezier(.16,.88,.18,1)');showWinner(display[index])};rotor.addEventListener('transitionend',done)}function showWinner(prize){overlayIcon.innerHTML=iconSvg(prize.icon);overlayPrize.textContent=prize.label;overlay.classList.add('show');confettiBurst(overlay.querySelector('.overlay-card'));setTexts(prize.label,'Winner selected','Tap anywhere to continue');if(winTimer)clearInterval(winTimer);winTimer=scheduleAfterWin(closeWinner)}function closeWinner(){if(winTimer)clearInterval(winTimer);overlay.classList.remove('show');if(getSettings().afterWinAction==='menu')location.href='index.html';else resetWheel()}function resetWheel(){rotor.style.transition='none';currentRotation=0;rotor.style.transform='rotate(0deg)';requestAnimationFrame(()=>rotor.style.transition='transform 5.2s cubic-bezier(.16,.88,.18,1)');setTexts('Tap spin to begin','Land the prize under the pointer','Ready to play')}document.getElementById('homeBtn').onclick=()=>location.href='index.html';document.getElementById('resetBtn').onclick=resetWheel;document.getElementById('fsBtn').onclick=fullScreenToggle;document.getElementById('spinBtn').onclick=spinWheel;overlay.onclick=closeWinner;(async()=>{prizes=await loadPrizeMaster();display=prizes.filter(p=>!/spin again/i.test(p.label)).slice(0,8);while(display.length<6)display.push(prizes[0]);display=display.slice(0,8);buildWheel()})();
</script></body></html>
