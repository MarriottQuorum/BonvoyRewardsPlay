<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spin &amp; Win</title><style>:root{--gold:#d4af37;--gold2:#f4df8a;--text:#f7f3e8;--muted:#b9b0a0;}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 18%, rgba(212,175,55,.16), transparent 28%),linear-gradient(180deg, #111 0%, #050505 100%);color:var(--text);overflow:hidden}.screen{min-height:100%;padding:10px;display:grid;place-items:center}.frame{width:min(96vw, 820px);height:min(96vh, 1480px);border-radius:28px;border:1px solid rgba(212,175,55,.35);box-shadow:0 0 0 2px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.12),inset 0 0 80px rgba(212,175,55,.06);background:radial-gradient(circle at 50% 8%, rgba(212,175,55,.10), transparent 24%),linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),#050505;display:grid;grid-template-rows:auto 1fr auto;padding:14px 14px 18px;position:relative;overflow:hidden}.frame:before{content:''; position:absolute; inset:8px; border-radius:22px; border:1px solid rgba(212,175,55,.18); pointer-events:none}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;z-index:2}.eyebrow{color:var(--gold);font-weight:800;font-size:clamp(12px, 1.2vw, 18px);letter-spacing:.25em;text-transform:uppercase;margin-bottom:4px}h1{margin:0;line-height:.95;font-size:clamp(44px, 6.5vw, 84px);font-weight:900;letter-spacing:-.04em}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg, #1a1a1a, #0d0d0d);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(14px,1.4vw,22px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}.main{display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;padding-top:6px;padding-bottom:8px;gap:8px}.pointer{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid var(--gold);filter:drop-shadow(0 0 8px rgba(212,175,55,.65));z-index:3;margin-bottom:-8px}.wheel-wrap{width:min(82vw, 620px);height:min(82vw, 620px);position:relative;display:grid;place-items:center}.wheel{width:100%;height:100%;border-radius:50%;position:relative;border:6px solid var(--gold);box-shadow:0 0 28px rgba(212,175,55,.35), inset 0 0 22px rgba(255,255,255,.08);transition:transform 5.2s cubic-bezier(.16,.88,.18,1);overflow:hidden;background:#111}.wheel:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%, rgba(255,255,255,.14), transparent 22%),radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.18) 100%);pointer-events:none}.segment-label{position:absolute;left:50%;top:50%;transform-origin:0 0;width:22%;text-align:center;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.62);font-size:clamp(12px,1.25vw,17px);line-height:1.02;pointer-events:none}.segment-label span{display:block;max-width:100%}.center-spin{position:absolute;width:min(20vw, 132px);height:min(20vw, 132px);min-width:92px;min-height:92px;border:none;border-radius:50%;background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);color:#101010;font-size:clamp(20px, 4vw, 40px);font-weight:900;letter-spacing:-.04em;cursor:pointer;z-index:4;box-shadow:0 0 28px rgba(212,175,55,.5), inset 0 2px 10px rgba(255,255,255,.5), 0 10px 30px rgba(0,0,0,.45)}.center-spin:disabled{cursor:not-allowed;filter:saturate(.9)}.status{text-align:center;margin-top:8px}.mini{color:var(--gold);font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(11px, 1vw, 16px);margin-bottom:4px}.headline{font-size:clamp(34px, 5.7vw, 74px);font-weight:900;line-height:.92;margin:0 12px;text-shadow:0 3px 12px rgba(0,0,0,.45)}.sub{color:var(--muted);font-size:clamp(15px, 1.8vw, 26px);margin-top:10px}.footer{display:grid;justify-items:center;gap:10px;padding-bottom:2px}.footer img{max-width:min(60vw, 420px);width:100%;height:auto;opacity:.96}.footer-note{font-size:clamp(12px, 1.15vw, 18px);color:#d6d0c3;text-align:center}.overlay{position:absolute; inset:0; background:rgba(0,0,0,.86); display:none; align-items:center; justify-content:center; padding:28px; z-index:30}.overlay.show{display:flex}.overlay-card{width:min(90%, 920px); border-radius:34px; border:1px solid rgba(212,175,55,.36); background:radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%),linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), #080808; box-shadow:0 0 0 1px rgba(212,175,55,.08) inset, 0 0 40px rgba(212,175,55,.16); padding:42px 28px; text-align:center}.winner{font-size:clamp(48px, 10vw, 142px);font-weight:900;line-height:.88;margin:0;letter-spacing:-.04em;text-shadow:0 0 18px rgba(255,245,200,.18)}.congrats{color:var(--gold2);font-size:clamp(24px, 3.1vw, 48px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;margin-top:14px}.prize{font-size:clamp(34px, 6vw, 84px);font-weight:900;line-height:1;margin-top:24px}.returning{color:#ddd5c9;font-size:clamp(18px, 2.2vw, 30px);margin-top:18px}</style></head><body><div class="screen"><div class="frame"><div class="top"><div><div class="eyebrow">Bonvoy Rewards Play</div><h1>Spin &amp; Win</h1></div><div class="controls"><button class="btn" id="homeBtn">Home</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="fsBtn">Full Screen</button></div></div><div class="main"><div class="wheel-panel"><div class="pointer"></div><div class="wheel-wrap"><div id="wheel" class="wheel"></div><button id="spinBtn" class="center-spin">SPIN</button></div></div><div class="status"><div class="mini">Spin &amp; Win</div><div id="headline" class="headline">Tap spin to begin</div><div id="sub" class="sub">Prize source ready · waiting for spin</div></div></div><div class="footer"><img alt="Marriott Bonvoy" src="BONVOY_LOGO_2C_REV_RGB.png" onerror="this.style.display='none'"><div id="footerNote" class="footer-note">Ready to play</div></div><div id="overlay" class="overlay"><div class="overlay-card"><h2 class="winner">WINNER</h2><div class="congrats">Congratulations</div><div id="overlayPrize" class="prize">Prize</div><div id="overlayReturn" class="returning">Tap to continue</div></div></div></div></div><script>

const SETTINGS_KEY = 'bonvoyRewardsPlaySettings';
const PRIZE_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";
const DEFAULT_SETTINGS = { soundOn: true, randomPath: false, popupSeconds: 8, afterWinAction: 'menu' };
const DEFAULT_PRIZES = [
  {label:'500 Points', accent:'blue'}, {label:'1,000 Points', accent:'blue'}, {label:'1,500 Points', accent:'blue'},
  {label:'2,500 Points', accent:'purple'}, {label:'Free Parking', accent:'teal'}, {label:'Free Appetizer', accent:'amber'},
  {label:'Starbucks Drink', accent:'amber'}, {label:'Breakfast for 2', accent:'teal'}, {label:'Late Checkout', accent:'gold'},
  {label:'Gift Shop Snack/Drink', accent:'amber'}, {label:'Bonus Treat', accent:'teal'}, {label:'Room Upgrade', accent:'gold'},
  {label:'Spin Again', accent:'purple'}, {label:'Spin Again and Win Double', accent:'purple'}
];
const ACCENT_COLORS = { blue:'#154fa7', teal:'#0d6a63', purple:'#6e2cb0', amber:'#915112', gold:'#6e5b19', neutral:'#3b3b3b' };
function loadSettings(){ try{ const raw=localStorage.getItem(SETTINGS_KEY); const parsed=raw?JSON.parse(raw):{}; return {...DEFAULT_SETTINGS, ...parsed, popupSeconds:Math.max(3, Math.min(20, Number(parsed.popupSeconds ?? DEFAULT_SETTINGS.popupSeconds)))}; } catch(e){ return {...DEFAULT_SETTINGS}; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function parseCsvLine(line){ const result=[]; let current='', inQuotes=false; for(let i=0;i<line.length;i++){ const ch=line[i], next=line[i+1]; if(ch==='"'){ if(inQuotes && next==='"'){ current+='"'; i++; } else inQuotes=!inQuotes; } else if(ch===',' && !inQuotes){ result.push(current.trim()); current=''; } else current+=ch; } result.push(current.trim()); return result; }
function normalizeAccent(a){ const k=(a||'').toLowerCase(); return ACCENT_COLORS[k] ? k : 'blue'; }
async function fetchPrizeRows(){
  try{
    const res = await fetch(PRIZE_CSV, {cache:'no-store'}); const text = await res.text();
    const lines = text.replace(/^\uFEFF/, '').trim().split(/\r?\n/).filter(Boolean); if(!lines.length) throw new Error('empty csv');
    const headers = parseCsvLine(lines[0]).map(h=>h.toLowerCase());
    const idx = { active: headers.indexOf('active'), label: headers.indexOf('prize label'), accent: headers.indexOf('accent') };
    const rows = lines.slice(1).map(parseCsvLine).map(cols => {
      const active = idx.active >= 0 ? (cols[idx.active] || '').trim().toLowerCase() : 'yes';
      const label = idx.label >= 0 ? (cols[idx.label] || '').trim() : (cols[0] || '').trim();
      const accent = idx.accent >= 0 ? normalizeAccent(cols[idx.accent] || '') : 'blue';
      return {active, label, accent};
    }).filter(r => r.label && (!r.active || r.active === 'yes' || r.active === 'true' || r.active === '1'));
    return rows.length ? rows : DEFAULT_PRIZES;
  }catch(err){ console.warn('Prize feed fallback', err); return DEFAULT_PRIZES; }
}
function shortPrizeLabel(label){ const map={ 'Gift Shop Snack/Drink':'Gift Shop', 'Spin Again and Win Double':'Double Win', 'Free Appetizer':'Appetizer', 'Breakfast for 2':'Breakfast', 'Late Checkout':'Late Check-out', 'Starbucks Drink':'Coffee', 'Room Upgrade':'Upgrade', 'Free Parking':'Parking', 'Bonus Treat':'Bonus', 'M Club Access':'M Club' }; return map[label] || label.replace(/^Free\s+/,'').replace(/\s+Points$/,' Pts'); }
function escapeHtml(s){ return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function audioTick(freq=720, dur=.07, vol=.05){ if(!loadSettings().soundOn) return; const Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return; if(!window.__ctx) window.__ctx = new Ctx(); const c = window.__ctx; if(c.state === 'suspended') c.resume().catch(()=>{}); const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=freq; g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur); }

let settings=loadSettings(), prizes=[], spinning=false, currentRotation=0, segmentAngle=45, overlayInterval=null; const wheel=document.getElementById('wheel'), spinBtn=document.getElementById('spinBtn'), headline=document.getElementById('headline'), sub=document.getElementById('sub'), footerNote=document.getElementById('footerNote'), overlay=document.getElementById('overlay'), overlayPrize=document.getElementById('overlayPrize'), overlayReturn=document.getElementById('overlayReturn');
function buildWheel(){ const n=prizes.length; segmentAngle=360/n; const parts=[]; for(let i=0;i<n;i++){ const c=ACCENT_COLORS[prizes[i].accent]||ACCENT_COLORS.blue; parts.push(c+' '+(i*segmentAngle)+'deg '+((i+1)*segmentAngle)+'deg'); } wheel.style.background='conic-gradient(from '+(-90-segmentAngle/2)+'deg, '+parts.join(',')+')'; wheel.querySelectorAll('.segment-label').forEach(el=>el.remove()); for(let i=0;i<n;i++){ const label=document.createElement('div'); label.className='segment-label'; const angle=i*segmentAngle + segmentAngle/2; label.style.transform='translate(-50%, -50%) rotate('+angle+'deg) translateY(-225px)'; label.innerHTML='<span style="transform: rotate('+(-angle)+'deg)">'+escapeHtml(shortPrizeLabel(prizes[i].label)).replace(/ /g,'<br>')+'</span>'; wheel.appendChild(label); } }
function showWinner(prize){ overlayPrize.textContent=prize; overlay.classList.add('show'); let secs=settings.popupSeconds; overlayReturn.textContent = settings.afterWinAction==='menu' ? 'Returning to menu in '+secs+'s' : 'Returning to game in '+secs+'s'; if(overlayInterval) clearInterval(overlayInterval); overlayInterval=setInterval(()=>{ secs--; overlayReturn.textContent = settings.afterWinAction==='menu' ? 'Returning to menu in '+secs+'s' : 'Returning to game in '+secs+'s'; if(secs<=0){ clearInterval(overlayInterval); overlay.classList.remove('show'); if(settings.afterWinAction==='menu') location.href='index.html'; else resetWheel(); } },1000); }
function spinWheel(){ if(spinning) return; settings=loadSettings(); spinning=true; spinBtn.disabled=true; headline.textContent='Spinning…'; sub.textContent='Good luck'; footerNote.textContent='Wheel in motion'; const index=Math.floor(Math.random()*prizes.length); const targetCenter=index*segmentAngle + segmentAngle/2; const extraSpins=360*6; currentRotation += extraSpins; const normalized=((currentRotation%360)+360)%360; const delta=(360 - ((targetCenter + normalized)%360))%360; currentRotation += delta; wheel.style.transform='rotate('+currentRotation+'deg)'; audioTick(760,.09,.06); setTimeout(()=>audioTick(620,.08,.05),800); setTimeout(()=>audioTick(520,.08,.05),1800); const done=()=>{ wheel.removeEventListener('transitionend', done); const prize=prizes[index].label; headline.textContent=prize; sub.textContent='Winner selected'; footerNote.textContent='Tap anywhere to continue'; spinning=false; spinBtn.disabled=false; currentRotation=currentRotation%360; wheel.style.transition='none'; wheel.style.transform='rotate('+currentRotation+'deg)'; requestAnimationFrame(()=>{ wheel.style.transition='transform 5.2s cubic-bezier(.16,.88,.18,1)'; }); showWinner(prize); }; wheel.addEventListener('transitionend', done); }
function resetWheel(){ overlay.classList.remove('show'); if(overlayInterval) clearInterval(overlayInterval); spinning=false; spinBtn.disabled=false; currentRotation=0; wheel.style.transition='none'; wheel.style.transform='rotate(0deg)'; requestAnimationFrame(()=>{ wheel.style.transition='transform 5.2s cubic-bezier(.16,.88,.18,1)'; }); headline.textContent='Tap spin to begin'; sub.textContent='Prize source ready · waiting for spin'; footerNote.textContent='Ready to play'; }
spinBtn.addEventListener('click', spinWheel); overlay.addEventListener('click', ()=>{ if(overlayInterval) clearInterval(overlayInterval); overlay.classList.remove('show'); if(loadSettings().afterWinAction==='menu') location.href='index.html'; else resetWheel(); }); document.getElementById('resetBtn').addEventListener('click', resetWheel); document.getElementById('homeBtn').addEventListener('click', ()=>location.href='index.html'); document.getElementById('fsBtn').addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }); (async function(){ const rows=await fetchPrizeRows(); prizes=rows.slice(0,8); while(prizes.length<6) prizes.push(DEFAULT_PRIZES[prizes.length % DEFAULT_PRIZES.length]); prizes=prizes.slice(0,8); buildWheel(); })();
</script></body></html>
