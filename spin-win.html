<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spin & Win</title>
<style>
  :root{
    --bg:#050505;
    --panel:#0d0d0d;
    --gold:#d4af37;
    --gold2:#f4df8a;
    --text:#f7f3e8;
    --muted:#b9b0a0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 50% 18%, rgba(212,175,55,.16), transparent 28%),
      linear-gradient(180deg, #111 0%, #050505 100%);
    color:var(--text);
    overflow:hidden;
  }
  .screen{
    min-height:100%;
    padding:10px;
    display:grid;
    place-items:center;
  }
  .frame{
    width:min(96vw, 820px);
    height:min(96vh, 1480px);
    border-radius:28px;
    border:1px solid rgba(212,175,55,.35);
    box-shadow:
      0 0 0 2px rgba(212,175,55,.08) inset,
      0 0 40px rgba(212,175,55,.12),
      inset 0 0 80px rgba(212,175,55,.06);
    background:
      radial-gradient(circle at 50% 8%, rgba(212,175,55,.10), transparent 24%),
      linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),
      #050505;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:14px 14px 18px;
    position:relative;
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute; inset:8px;
    border-radius:22px;
    border:1px solid rgba(212,175,55,.18);
    pointer-events:none;
  }
  .top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    z-index:2;
  }
  .eyebrow{
    color:var(--gold);
    font-weight:800;
    font-size:clamp(12px, 1.2vw, 18px);
    letter-spacing:.25em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    margin:0;
    line-height:.95;
    font-size:clamp(44px, 6.5vw, 84px);
    font-weight:900;
    letter-spacing:-.04em;
  }
  .controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
  .btn{
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg, #1a1a1a, #0d0d0d);
    color:#fff;
    border-radius:16px;
    padding:12px 16px;
    font-weight:800;
    font-size:clamp(14px,1.4vw,22px);
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .btn:hover{border-color:rgba(212,175,55,.35)}
  .main{
    display:grid;
    grid-template-rows:auto 1fr auto;
    align-items:center;
    justify-items:center;
    padding-top:6px;
    padding-bottom:8px;
    gap:8px;
  }
  .wheel-panel{
    width:100%;
    display:grid;
    place-items:center;
    position:relative;
    padding-top:14px;
  }
  .pointer{
    width:0;height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-bottom:26px solid var(--gold);
    filter:drop-shadow(0 0 8px rgba(212,175,55,.65));
    z-index:3;
    margin-bottom:-8px;
  }
  .wheel-wrap{
    width:min(82vw, 620px);
    height:min(82vw, 620px);
    position:relative;
    display:grid;
    place-items:center;
  }
  .wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    border:6px solid var(--gold);
    box-shadow:
      0 0 28px rgba(212,175,55,.35),
      inset 0 0 22px rgba(255,255,255,.08);
    transition: transform 5.2s cubic-bezier(.16, .88, .18, 1);
    overflow:hidden;
    background:#111;
  }
  .wheel::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 25%, rgba(255,255,255,.16), transparent 22%),
      radial-gradient(circle at 50% 50%, transparent 58%, rgba(0,0,0,.18) 100%);
    pointer-events:none;
  }
  .center-spin{
    position:absolute;
    width:min(20vw, 132px);
    height:min(20vw, 132px);
    min-width:92px;
    min-height:92px;
    border:none;
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);
    color:#101010;
    font-size:clamp(20px, 4vw, 40px);
    font-weight:900;
    letter-spacing:-.04em;
    cursor:pointer;
    z-index:4;
    box-shadow:
      0 0 28px rgba(212,175,55,.5),
      inset 0 2px 10px rgba(255,255,255,.5),
      0 10px 30px rgba(0,0,0,.45);
  }
  .center-spin:disabled{
    cursor:not-allowed;
    filter:saturate(.9);
  }
  .labels{
    position:absolute; inset:0;
    pointer-events:none;
    transition: transform 5.2s cubic-bezier(.16,.88,.18,1);
  }
  .label{
    position:absolute;
    left:50%; top:50%;
    transform-origin:0 0;
    width:42%;
    text-align:right;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    font-size:clamp(12px, 1.75vw, 22px);
    line-height:1.02;
    padding-right:16px;
    white-space:normal;
  }
  .status{
    text-align:center;
    margin-top:8px;
  }
  .mini{
    color:var(--gold);
    font-weight:800;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:clamp(11px, 1vw, 16px);
    margin-bottom:4px;
  }
  .headline{
    font-size:clamp(34px, 5.7vw, 74px);
    font-weight:900;
    line-height:.92;
    margin:0 12px;
    text-shadow:0 3px 12px rgba(0,0,0,.45);
  }
  .sub{
    color:var(--muted);
    font-size:clamp(15px, 1.8vw, 26px);
    margin-top:10px;
  }
  .footer{
    display:grid;
    justify-items:center;
    gap:10px;
    padding-bottom:2px;
  }
  .footer img{
    max-width:min(60vw, 420px);
    width:100%;
    height:auto;
    opacity:.96;
  }
  .footer-note{
    font-size:clamp(12px, 1.15vw, 18px);
    color:#d6d0c3;
    text-align:center;
  }
  .overlay{
    position:absolute; inset:0;
    background:rgba(0,0,0,.86);
    display:none;
    align-items:center;
    justify-content:center;
    padding:28px;
    z-index:30;
  }
  .overlay.show{display:flex}
  .overlay-card{
    width:min(90%, 920px);
    border-radius:34px;
    border:1px solid rgba(212,175,55,.36);
    background:
      radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%),
      linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)),
      #080808;
    box-shadow:
      0 0 0 1px rgba(212,175,55,.08) inset,
      0 0 40px rgba(212,175,55,.16);
    padding:42px 28px;
    text-align:center;
  }
  .winner{
    font-size:clamp(48px, 10vw, 142px);
    font-weight:900;
    line-height:.88;
    margin:0;
    letter-spacing:-.04em;
    text-shadow:0 0 18px rgba(255,245,200,.18);
  }
  .congrats{
    color:var(--gold2);
    font-size:clamp(24px, 3.1vw, 48px);
    font-weight:900;
    letter-spacing:.26em;
    text-transform:uppercase;
    margin-top:14px;
  }
  .prize{
    font-size:clamp(34px, 6vw, 84px);
    font-weight:900;
    line-height:1;
    margin-top:24px;
  }
  .returning{
    color:#ddd5c9;
    font-size:clamp(18px, 2.2vw, 30px);
    margin-top:18px;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="frame">
    <div class="top">
      <div>
        <div class="eyebrow">Bonvoy Rewards Play</div>
        <h1>Spin &amp; Win</h1>
      </div>
      <div class="controls">
        <button class="btn" id="homeBtn">Home</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="fsBtn">Full Screen</button>
      </div>
    </div>

    <div class="main">
      <div class="wheel-panel">
        <div class="pointer"></div>
        <div class="wheel-wrap">
          <div id="wheel" class="wheel"></div>
          <div id="labels" class="labels"></div>
          <button id="spinBtn" class="center-spin">SPIN</button>
        </div>
      </div>

      <div class="status">
        <div class="mini">Spin &amp; Win</div>
        <div id="headline" class="headline">Tap spin to begin</div>
        <div id="sub" class="sub">Prize source ready · waiting for spin</div>
      </div>
    </div>

    <div class="footer">
      <img alt="Marriott Bonvoy" src="BONVOY_LOGO_2C_REV_RGB.png" onerror="this.style.display='none'">
      <div id="footerNote" class="footer-note">Ready to play</div>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 class="winner">WINNER</h2>
        <div class="congrats">Congratulations</div>
        <div id="overlayPrize" class="prize">Prize</div>
        <div id="overlayReturn" class="returning">Tap to continue</div>
      </div>
    </div>
  </div>
</div>

<script>
  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgWcTqPKI2xoPVMrQtN_7UNlDkkrFymRsMLnBNDWByUj6QgKfwq6oJbfYioTDtiuaW6JHJQuWBmwX-/pub?output=csv";
  const DEFAULT_PRIZES = [
    "500 Points","Bar Drink","Free Parking","1,000 Points",
    "2,500 Points","Breakfast for 2","Late Checkout","Gift Shop Snack/Drink"
  ];
  const SEGMENT_COLORS = ["#1a4fa4","#91500f","#166c78","#7b31bf","#155f56","#9a5817","#143f87","#7d4309"];

  let prizes = [];
  let spinning = false;
  let currentRotation = 0;
  let segmentAngle = 45;

  const wheel = document.getElementById("wheel");
  const labels = document.getElementById("labels");
  const spinBtn = document.getElementById("spinBtn");
  const headline = document.getElementById("headline");
  const sub = document.getElementById("sub");
  const footerNote = document.getElementById("footerNote");
  const overlay = document.getElementById("overlay");
  const overlayPrize = document.getElementById("overlayPrize");
  const homeBtn = document.getElementById("homeBtn");
  const resetBtn = document.getElementById("resetBtn");
  const fsBtn = document.getElementById("fsBtn");

  function parseCsvLine(line){
    const result = [];
    let current = "", inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i], next = line[i+1];
      if(ch === '"'){
        if(inQuotes && next === '"'){ current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch === ',' && !inQuotes){
        result.push(current.trim()); current = "";
      } else current += ch;
    }
    result.push(current.trim());
    return result;
  }

  async function loadPrizes(){
    try{
      const res = await fetch(SHEET_URL, {cache:'no-store'});
      const text = await res.text();
      const lines = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/).filter(Boolean);
      const rows = lines[0] && /active|prize label|label/i.test(lines[0]) ? lines.slice(1) : lines;
      const pulled = [];
      for(const row of rows){
        const cols = parseCsvLine(row);
        const active = (cols[0] || "").toLowerCase();
        const label = (cols[1] || cols[0] || "").trim();
        if((active === "yes" || active === "true" || active === "1" || !cols[1]) && label){
          pulled.push(label);
        }
      }
      prizes = (pulled.length ? pulled : DEFAULT_PRIZES).slice(0, 8);
    } catch(err){
      prizes = DEFAULT_PRIZES.slice();
    }
    while(prizes.length < 6) prizes.push(DEFAULT_PRIZES[prizes.length % DEFAULT_PRIZES.length]);
    prizes = prizes.slice(0, 8);
    buildWheel();
    sub.textContent = "Prize source ready · waiting for spin";
    footerNote.textContent = "Live prize source loaded";
  }

  function buildWheel(){
    const n = prizes.length;
    segmentAngle = 360 / n;

    const gradientParts = [];
    for(let i=0;i<n;i++){
      const c = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
      const start = i * segmentAngle;
      const end = (i + 1) * segmentAngle;
      gradientParts.push(`${c} ${start}deg ${end}deg`);
    }
    wheel.style.background = `conic-gradient(from ${-90 - segmentAngle/2}deg, ${gradientParts.join(", ")})`;

    labels.innerHTML = "";
    for(let i=0;i<n;i++){
      const mid = i * segmentAngle;
      const lab = document.createElement("div");
      lab.className = "label";
      lab.style.transform = `translate(-2%, -50%) rotate(${mid}deg) translateX(12%)`;
      lab.innerHTML = `<div style="transform: rotate(${90 + segmentAngle/2}deg)">${prizes[i]}</div>`;
      labels.appendChild(lab);
    }
  }

  function spinWheel(){
    if(spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    headline.textContent = "Spinning…";
    sub.textContent = "Good luck";
    footerNote.textContent = "Wheel in motion";

    const index = Math.floor(Math.random() * prizes.length);
    const targetCenter = index * segmentAngle + segmentAngle / 2;
    const extraSpins = 360 * 6;

    currentRotation += extraSpins;
    const normalized = ((currentRotation % 360) + 360) % 360;
    const delta = (360 - ((targetCenter + normalized) % 360)) % 360;
    currentRotation += delta;

    wheel.style.transform = `rotate(${currentRotation}deg)`;
    labels.style.transform = `rotate(${currentRotation}deg)`;

    const done = () => {
      wheel.removeEventListener("transitionend", done);
      showWinner(prizes[index]);
      spinning = false;
      spinBtn.disabled = false;
      currentRotation = currentRotation % 360;
      wheel.style.transition = "none";
      labels.style.transition = "none";
      wheel.style.transform = `rotate(${currentRotation}deg)`;
      labels.style.transform = `rotate(${currentRotation}deg)`;
      requestAnimationFrame(() => {
        wheel.style.transition = "transform 5.2s cubic-bezier(.16,.88,.18,1)";
        labels.style.transition = "transform 5.2s cubic-bezier(.16,.88,.18,1)";
      });
    };
    wheel.addEventListener("transitionend", done);
  }

  function showWinner(prize){
    overlayPrize.textContent = prize;
    overlay.classList.add("show");
    headline.textContent = prize;
    sub.textContent = "Winner selected";
    footerNote.textContent = "Tap anywhere to continue";
  }

  function closeWinner(){
    overlay.classList.remove("show");
    headline.textContent = "Tap spin to begin";
    sub.textContent = "Prize source ready · waiting for spin";
    footerNote.textContent = "Ready to play";
  }

  function resetWheel(){
    overlay.classList.remove("show");
    spinning = false;
    spinBtn.disabled = false;
    currentRotation = 0;
    wheel.style.transition = "none";
    labels.style.transition = "none";
    wheel.style.transform = "rotate(0deg)";
    labels.style.transform = "rotate(0deg)";
    requestAnimationFrame(() => {
      wheel.style.transition = "transform 5.2s cubic-bezier(.16,.88,.18,1)";
      labels.style.transition = "transform 5.2s cubic-bezier(.16,.88,.18,1)";
    });
    headline.textContent = "Tap spin to begin";
    sub.textContent = "Prize source ready · waiting for spin";
    footerNote.textContent = "Ready to play";
  }

  function toggleFull(){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }

  spinBtn.addEventListener("click", spinWheel);
  overlay.addEventListener("click", closeWinner);
  resetBtn.addEventListener("click", resetWheel);
  homeBtn.addEventListener("click", () => location.href = "index.html");
  fsBtn.addEventListener("click", toggleFull);

  loadPrizes();
</script>
</body>
</html>
