<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spin & Win</title>
<style>
:root{--bg:#050505;--gold:#d4af37;--gold2:#f0d37a;--text:#f8f2e6;--muted:rgba(248,242,230,.74);--line:rgba(212,175,55,.22);--shadow:0 20px 60px rgba(0,0,0,.58);}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 10%, rgba(212,175,55,.12), transparent 20%), linear-gradient(180deg,#111 0%, #030303 100%);overflow:hidden}
.screen{height:100vh;padding:18px;display:flex;justify-content:center;align-items:center}
.frame{position:relative;width:min(100%,920px);height:min(calc(100vh - 36px),1600px);border-radius:34px;border:1px solid var(--line);background:linear-gradient(180deg, rgba(18,18,18,.995), rgba(5,5,5,.998));box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), inset 0 0 70px rgba(212,175,55,.05), 0 0 36px rgba(212,175,55,.10), var(--shadow);overflow:hidden;padding:18px 20px 16px;display:grid;grid-template-rows:auto 1fr auto;gap:12px}
.frame:before,.frame:after{content:"";position:absolute;inset:0;pointer-events:none}
.frame:before{background:radial-gradient(circle at 12% 20%, rgba(212,175,55,.2) 0 2px, transparent 3px),radial-gradient(circle at 84% 16%, rgba(212,175,55,.2) 0 2px, transparent 3px),radial-gradient(circle at 14% 84%, rgba(212,175,55,.16) 0 2px, transparent 3px),radial-gradient(circle at 86% 86%, rgba(212,175,55,.16) 0 2px, transparent 3px)}
.frame:after{inset:12px;border-radius:28px;border:1px solid rgba(212,175,55,.10)}
.topbar{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brand{display:grid;gap:6px} .eyebrow{color:var(--gold2);font-size:.92rem;letter-spacing:.26em;text-transform:uppercase;font-weight:800} .title{font-size:clamp(2rem,4vw,3.8rem);font-weight:900;line-height:.95;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(34,34,34,.96), rgba(16,16,16,.98));color:var(--text);cursor:pointer;min-height:44px;padding:10px 16px;border-radius:14px;font-weight:800;font-size:.92rem;box-shadow:0 10px 22px rgba(0,0,0,.32)}
.main{position:relative;z-index:1;display:grid;grid-template-rows:1fr auto;gap:14px;min-height:0}
.stage{position:relative;border-radius:30px;border:1px solid rgba(212,175,55,.2);background:radial-gradient(circle at 50% 8%, rgba(255,255,255,.07), transparent 22%), linear-gradient(180deg, rgba(18,18,18,.995), rgba(7,7,7,.998));display:grid;place-items:center;padding:20px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 0 24px rgba(212,175,55,.08)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center, rgba(212,175,55,.12), transparent 38%);pointer-events:none}
.wheel-wrap{position:relative;width:min(100%, 76vh);aspect-ratio:1/1;display:grid;place-items:center}
.pointer{position:absolute;top:2%;left:50%;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:0;border-bottom:44px solid #f0d37a;filter:drop-shadow(0 0 16px rgba(212,175,55,.5));z-index:5}
.pointer:after{content:"";position:absolute;left:-18px;top:6px;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:30px solid #513400}
.wheel-shadow{position:absolute;inset:14%;border-radius:50%;box-shadow:0 0 70px rgba(212,175,55,.18), inset 0 0 40px rgba(255,255,255,.06)}
#wheel{position:absolute;inset:6%;border-radius:50%;border:10px solid #d4af37;background:#111;box-shadow:0 0 26px rgba(212,175,55,.34), inset 0 0 18px rgba(255,255,255,.1);overflow:hidden;transition:transform 6s cubic-bezier(.09,.8,.16,1)}
#wheelInner{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -22.5deg, #0e5160 0 45deg, #7a420f 45deg 90deg, #0d345d 90deg 135deg, #6b2aa8 135deg 180deg, #0c6056 180deg 225deg, #8b5616 225deg 270deg, #0d3f85 270deg 315deg, #6e3a10 315deg 360deg)}
.segment-label{position:absolute;left:50%;top:50%;transform-origin:center center;font-weight:900;color:#fff6dd;text-shadow:0 2px 8px rgba(0,0,0,.5);text-align:center;line-height:1.1;width:26%;font-size:clamp(14px,1.7vw,26px)}
.segment-label span{display:block;transform:translate(-50%,-50%)}
.ring-dots{position:absolute;inset:4%;border-radius:50%;pointer-events:none}
.ring-dots span{position:absolute;width:10px;height:10px;border-radius:50%;background:#f7d97d;box-shadow:0 0 10px rgba(212,175,55,.6)}
.center-cap{position:absolute;inset:39%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%, #f6dd86, #d4af37 42%, #8a6417 100%);color:#2a1800;font-weight:900;font-size:clamp(2rem,4vw,3.2rem);box-shadow:0 0 20px rgba(212,175,55,.35), inset 0 2px 0 rgba(255,255,255,.5), inset 0 -8px 18px rgba(97,65,0,.34)}
.result-panel{display:grid;justify-items:center;gap:12px;margin-top:10px}
.result-kicker{color:var(--gold2);font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;font-weight:800}
.result{font-size:clamp(2rem,4.8vw,4.5rem);line-height:.98;font-weight:900;text-align:center;min-height:1.9em;text-shadow:0 3px 16px rgba(0,0,0,.45)}
.spin-btn{border:0;border-radius:999px;min-width:220px;min-height:64px;padding:14px 24px;cursor:pointer;background:radial-gradient(circle at 30% 26%, #fff0a6, #f6d96a 22%, #d4af37 58%, #9e741a 100%);color:#1b1200;font-weight:900;font-size:clamp(1.2rem,2vw,1.7rem);box-shadow:0 0 28px rgba(212,175,55,.28), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -10px 22px rgba(96,62,0,.3)}
.footer{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;align-content:end;min-height:110px} .line{width:100%;height:1px;background:linear-gradient(90deg, transparent, rgba(212,175,55,.42), transparent)} .brand-lock img{width:min(100%,430px);height:auto;display:block;filter:drop-shadow(0 0 14px rgba(212,175,55,.08))} .footer-copy{text-align:center;color:var(--muted);font-size:.96rem}
.winner-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at center, rgba(212,175,55,.14), transparent 25%), rgba(4,4,4,.9);backdrop-filter:blur(4px);z-index:110} .winner-overlay.show{display:flex}
.winner-card{width:min(90vw,900px);min-height:min(42vh,400px);padding:34px 28px;border-radius:32px;border:1px solid rgba(212,175,55,.32);background:radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 32%), linear-gradient(180deg, rgba(18,18,18,.995), rgba(6,6,6,.998));display:grid;place-items:center;text-align:center;box-shadow:0 0 50px rgba(212,175,55,.16),0 24px 70px rgba(0,0,0,.6)}
.winner-title{margin:0;font-size:clamp(3rem,9vw,8rem);line-height:.88;font-weight:900;letter-spacing:.04em;color:#fff7d8;text-transform:uppercase;text-shadow:0 0 24px rgba(212,175,55,.32)} .winner-sub{margin:0;color:var(--gold2);font-size:clamp(1rem,2vw,1.5rem);font-weight:800;letter-spacing:.24em;text-transform:uppercase} .winner-prize{margin:0;font-size:clamp(2rem,5vw,4.6rem);font-weight:900;line-height:1.02;max-width:88%} .winner-countdown{margin-top:8px;color:var(--muted);font-size:clamp(1rem,1.6vw,1.2rem)}
@media (max-width:760px){.screen{padding:10px} .frame{height:calc(100vh - 20px);padding:14px 14px 12px;border-radius:28px} .topbar{align-items:flex-start;flex-wrap:wrap} .actions{width:100%;justify-content:flex-start} .title{font-size:2.5rem} .wheel-wrap{width:min(100%,62vh)} .pointer{border-left-width:20px;border-right-width:20px;border-bottom-width:34px} .spin-btn{min-width:180px;min-height:58px} }
</style>
</head>

const STORAGE_KEY = "bonvoyRewardsPlaySettings";
function loadSettings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return {
      randomPath: !!parsed.randomPath,
      soundOn: parsed.soundOn !== false,
      autoReturnOn: parsed.autoReturnOn !== false,
      autoReturnSeconds: Math.max(3, Math.min(30, Number(parsed.autoReturnSeconds || 10)))
    };
  } catch(e){
    return { randomPath:false, soundOn:true, autoReturnOn:true, autoReturnSeconds:10 };
  }
}
function saveSettings(next){ localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }

const defaults = [

function ensureAudio(){ const Ctx = window.AudioContext || window.webkitAudioContext; if(!audioCtx && Ctx) audioCtx = new Ctx(); return audioCtx; }
function unlockAudio(){ const c=ensureAudio(); if(c&&c.state==='suspended') c.resume().catch(()=>{}); }
function tick(freq=720,dur=.08,vol=.05){ if(!settings.soundOn) return; const c=ensureAudio(); if(!c||c.state!=='running') return; const o=c.createOscillator(); const g=c.createGain(); o.type='triangle'; o.frequency.value=freq; g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur); }
function parseCsvLine(line){const result=[];let current='';let inQuotes=false;for(let i=0;i<line.length;i++){const ch=line[i],n=line[i+1];if(ch==='"'){if(inQuotes&&n==='"'){current+='"';i++;}else inQuotes=!inQuotes;}else if(ch===','&&!inQuotes){result.push(current.trim());current='';}else current+=ch;}result.push(current.trim());return result;}
function mapAccent(a){ const key=(a||'').toLowerCase(); return key==='teal' ? '#0e645a' : key==='purple' ? '#6c2aa8' : key==='amber' ? '#8a4c14' : key==='gold' ? '#695112' : '#0d4f83'; }
async function loadPrizes(){ try{ const res = await fetch(SHEET_URL); const text = await res.text(); const lines=text.replace(/^﻿/,'').replace(//g,'').trim().split('
').filter(Boolean); if(lines.length>1){ const headers=parseCsvLine(lines[0]).map(s=>s.toLowerCase()); const rows=lines.slice(1).map(parseCsvLine); const ix={active:headers.indexOf('active'), label:headers.indexOf('prize label'), accent:headers.indexOf('accent')}; const parsed=rows.map(r=>({active:(r[ix.active]||'').toLowerCase(), label:r[ix.label]||'', color:mapAccent(r[ix.accent])})).filter(x=>x.label && (!x.active || x.active==='yes')).slice(0,8); if(parsed.length>=6) segments=parsed; } }catch(e){ } renderWheel(); }
function renderWheel(){ const count=segments.length; wheelInner.style.background='conic-gradient(from '+(-180/count)+'deg,'+segments.map((s,i)=>`${s.color} ${(360/count)*i}deg ${(360/count)*(i+1)}deg`).join(',')+')'; wheel.querySelectorAll('.segment-label').forEach(el=>el.remove()); segments.forEach((seg,i)=>{ const angle=(360/count)*i + (180/count); const label=document.createElement('div'); label.className='segment-label'; label.style.transform=`translate(-50%,-50%) rotate(${angle}deg) translateY(-33%)`; label.innerHTML=`<span style="transform: rotate(${-angle}deg)">${seg.label.replace(/ /g,'<br>')}</span>`; wheel.appendChild(label); }); ringDots.innerHTML=''; for(let i=0;i<36;i++){ const dot=document.createElement('span'); const ang=(Math.PI*2/36)*i; const r=46; dot.style.left=`calc(50% + ${Math.cos(ang)*r}%)`; dot.style.top=`calc(50% + ${Math.sin(ang)*r}%)`; ringDots.appendChild(dot); } footerCopy.textContent='Prize source live · settings loaded from main menu'; }
function showWinner(prize){ winnerPrize.textContent=prize; winnerOverlay.classList.add('show'); let secs=settings.autoReturnSeconds; winnerCountdown.textContent = settings.autoReturnOn ? `Returning to menu in ${secs}s` : 'Tap anywhere to close'; if(winnerTimer) clearInterval(winnerTimer); if(settings.autoReturnOn){ winnerTimer=setInterval(()=>{ secs--; winnerCountdown.textContent=`Returning to menu in ${secs}s`; if(secs<=0){ clearInterval(winnerTimer); location.href='index.html'; } },1000); } }
function spin(){ if(spinning) return; unlockAudio(); settings=loadSettings(); spinning=true; resultText.textContent='Spinning...'; spinBtn.disabled=true; const count=segments.length; const winnerIndex=Math.floor(Math.random()*count); const segmentAngle=360/count; const targetCenter=winnerIndex*segmentAngle + segmentAngle/2; const rotation = 360*6 + (360 - targetCenter); wheel.style.transform = `rotate(${rotation}deg)`; tick(880,.12,.06); setTimeout(()=>tick(640,.1,.05),650); setTimeout(()=>tick(520,.14,.05),1800); setTimeout(()=>{ const prize=segments[winnerIndex].label; resultText.textContent=prize; footerCopy.textContent='Winner: '+prize; spinning=false; spinBtn.disabled=false; showWinner(prize); },6100); }
spinBtn.addEventListener('click', spin); resetBtn.addEventListener('click', ()=>{ if(winnerTimer) clearInterval(winnerTimer); winnerOverlay.classList.remove('show'); spinning=false; wheel.style.transform='rotate(0deg)'; resultText.textContent='Tap spin to begin'; footerCopy.textContent='Prize source live · waiting for spin'; spinBtn.disabled=false; }); fsBtn.addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }); winnerOverlay.addEventListener('click', ()=>{ if(winnerTimer) clearInterval(winnerTimer); winnerOverlay.classList.remove('show'); if(!settings.autoReturnOn){ resultText.textContent='Tap spin to begin'; footerCopy.textContent='Prize source live · ready for next guest'; } else location.href='index.html'; });
document.addEventListener('pointerdown', unlockAudio, {passive:true});
loadPrizes();
</script>
