<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Loop</title>
  <style>
    :root {
      --bg:#050505;
      --bg2:#121212;
      --panel:#0b0b0b;
      --panel2:#151515;
      --gold:#d4af37;
      --gold-strong:#f1d274;
      --gold-soft:rgba(212,175,55,.18);
      --text:#faf4e8;
      --muted:rgba(250,244,232,.72);
      --line:rgba(212,175,55,.22);
      --shadow:0 20px 52px rgba(0,0,0,.58);
      --blue:#2668ff;
      --teal:#0fa58d;
      --purple:#6f2bce;
      --amber:#8c4a12;
      --goldTile:#5a4914;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 12%, rgba(212,175,55,.12), transparent 24%),
        linear-gradient(180deg, #111111 0%, #040404 100%);
      overflow:hidden;
    }
    .screen{
      width:100vw;height:100vh;padding:18px;
      display:flex;justify-content:center;align-items:center;
    }
    .frame{
      position:relative;
      width:min(100%, 920px);
      height:min(calc(100vh - 36px), 1600px);
      border-radius:34px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(19,19,19,.99), rgba(6,6,6,.995));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), inset 0 0 70px rgba(212,175,55,.05), 0 0 42px rgba(212,175,55,.12), var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:14px;
      padding:18px 18px 16px;
    }
    .frame::before,.frame::after{content:"";position:absolute;inset:0;pointer-events:none}
    .frame::before{
      background:
        radial-gradient(circle at 10% 10%, rgba(212,175,55,.26) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 14%, rgba(212,175,55,.22) 0 2px, transparent 3px),
        radial-gradient(circle at 16% 76%, rgba(212,175,55,.16) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 84%, rgba(212,175,55,.22) 0 2px, transparent 3px),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 18%);
      opacity:.95;
    }
    .frame::after{inset:12px;border-radius:26px;border:1px solid rgba(212,175,55,.12)}
    .topbar{
      position:relative;z-index:1;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .brand{display:grid;gap:6px}
    .eyebrow{color:var(--gold);font-size:.9rem;letter-spacing:.28em;text-transform:uppercase;font-weight:800}
    .title{font-size:clamp(2rem,4vw,3.7rem);font-weight:900;line-height:.95;margin:0}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .mini-btn{
      border:1px solid rgba(255,255,255,.07);
      background:linear-gradient(180deg, rgba(35,35,35,.96), rgba(16,16,16,.98));
      color:var(--text);cursor:pointer;
      border-radius:14px;padding:10px 14px;font-weight:800;font-size:.92rem;
      box-shadow:0 10px 22px rgba(0,0,0,.32);
    }
    .board-area{
      position:relative;z-index:1;
      min-height:0;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:12px;
    }
    .board-shell{
      position:relative;
      min-height:0;
      border-radius:30px;
      border:1px solid rgba(212,175,55,.22);
      background:
        radial-gradient(circle at top, rgba(255,255,255,.06), transparent 30%),
        linear-gradient(180deg, rgba(18,18,18,.99), rgba(7,7,7,.995));
      box-shadow:0 0 30px rgba(212,175,55,.08), inset 0 0 0 1px rgba(255,255,255,.03);
      padding:14px;
      overflow:hidden;
      display:grid;
      place-items:center;
    }
    .board{
      width:min(100%, 76vh);
      aspect-ratio:1/1;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(5,1fr);
      gap:10px;
      position:relative;
    }
    .tile{
      position:relative;
      border-radius:22px;
      display:grid;place-items:center;
      text-align:center;padding:10px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 0 20px rgba(0,0,0,.45);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .tile::before{
      content:"";position:absolute;inset:0;
      background:radial-gradient(circle at 50% 18%, rgba(255,255,255,.12), transparent 38%);
      opacity:.55;pointer-events:none;
    }
    .tile-text{
      position:relative;z-index:1;
      font-weight:900;
      line-height:1.02;
      font-size:clamp(14px,1.8vw,24px);
      text-shadow:0 2px 10px rgba(0,0,0,.45);
      max-width:96%;
      word-break:break-word;
      white-space:normal;
      overflow-wrap:anywhere;
    }
    .tile.active{
      transform:scale(1.03);
      border-color:rgba(255,255,255,.62);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 0 26px rgba(255,255,255,.24), 0 0 28px rgba(212,175,55,.28), 0 0 16px currentColor;
      animation:pulseGlow .85s infinite;
    }
    @keyframes pulseGlow {
      0% { filter:brightness(1); }
      50% { filter:brightness(1.16); }
      100% { filter:brightness(1); }
    }
    .center-card{
      grid-column:2 / span 3;
      grid-row:2 / span 3;
      border-radius:28px;
      border:1px solid rgba(212,175,55,.2);
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,.05), transparent 35%),
        linear-gradient(180deg, rgba(10,10,10,.995), rgba(3,3,3,.995));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 0 22px rgba(212,175,55,.08);
      display:grid;
      grid-template-rows:auto 1fr auto;
      padding:16px 14px 14px;
      min-width:0;min-height:0;
    }
    .center-top,.center-mid,.center-bottom{display:flex;align-items:center;justify-content:center}
    .center-top{min-height:28px}
    .center-mid{flex-direction:column;text-align:center;gap:14px;padding:8px 4px}
    .center-bottom{gap:10px;flex-wrap:wrap}
    .center-mark{color:var(--gold);text-transform:uppercase;letter-spacing:.24em;font-size:clamp(.72rem,1vw,.92rem);font-weight:800}
    .result{font-size:clamp(1.5rem,4vw,4rem);font-weight:900;line-height:.95;max-width:94%;text-shadow:0 3px 16px rgba(0,0,0,.5)}
    .helper{color:var(--muted);font-size:clamp(.9rem,1.4vw,1.1rem);line-height:1.4;max-width:24rem}
    .main-btn{
      width:clamp(128px,15vw,172px);height:clamp(128px,15vw,172px);
      border-radius:999px;border:0;cursor:pointer;
      display:grid;place-items:center;padding:0;
      font-weight:900;letter-spacing:.02em;text-transform:uppercase;
      font-size:clamp(1.5rem,3vw,3.1rem);
      color:#0b0b0b;
      background:radial-gradient(circle at 35% 30%, #f8e08a, #d4af37 60%, #a1781d 100%);
      box-shadow:0 0 34px rgba(212,175,55,.32), inset 0 0 0 1px rgba(255,255,255,.28), 0 16px 34px rgba(0,0,0,.42);
      transition:transform .14s ease, filter .14s ease;
    }
    .main-btn:hover,.main-btn:focus-visible{transform:translateY(-1px) scale(1.01);filter:brightness(1.04);outline:none}
    .main-btn.stop{border-radius:22px;width:clamp(140px,16vw,182px);height:clamp(84px,9vw,108px);font-size:clamp(1.1rem,2.2vw,2rem);color:#fff;background:linear-gradient(180deg,#c13030,#7e1313)}
    .main-btn.disabled{opacity:.75;cursor:not-allowed;filter:grayscale(.15)}
    .control-btn{
      border:1px solid rgba(255,255,255,.07);
      background:linear-gradient(180deg, rgba(34,34,34,.96), rgba(16,16,16,.98));
      color:var(--text);cursor:pointer;
      min-height:40px;padding:9px 14px;border-radius:14px;font-weight:800
    }
    .footer{
      position:relative;z-index:1;
      display:grid;gap:8px;justify-items:center;text-align:center;
      min-height:72px;
    }
    .footer-line{width:100%;height:1px;background:linear-gradient(90deg, transparent, rgba(212,175,55,.45), transparent)}
    .brand-lockup img{width:min(100%, 420px);max-width:68vw;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(212,175,55,.08))}
    .footer-copy{color:var(--muted);font-size:.96rem}
    .winner-overlay{
      position:fixed;inset:0;display:none;align-items:center;justify-content:center;
      background:
        radial-gradient(circle at center, rgba(212,175,55,.12), transparent 22%),
        rgba(4,4,4,.9);
      backdrop-filter:blur(4px);
      z-index:110;
      overflow:hidden;
    }
    .winner-overlay.show{display:flex}
    .winner-card{
      position:relative;
      width:min(90vw, 900px);
      min-height:min(44vh, 420px);
      padding:34px 28px;
      border-radius:32px;
      border:1px solid rgba(212,175,55,.34);
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 32%),
        linear-gradient(180deg, rgba(18,18,18,.995), rgba(6,6,6,.998));
      box-shadow:0 0 50px rgba(212,175,55,.18), 0 24px 70px rgba(0,0,0,.6);
      display:grid;place-items:center;text-align:center;overflow:hidden;
      animation:winnerPop .32s ease;
    }
    @keyframes winnerPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
    .winner-card::before{
      content:"";position:absolute;inset:0;
      background:
        radial-gradient(circle at center, rgba(212,175,55,.18), transparent 34%),
        radial-gradient(circle at 20% 18%, rgba(212,175,55,.16) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 16%, rgba(212,175,55,.18) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 82%, rgba(212,175,55,.16) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 82%, rgba(212,175,55,.18) 0 2px, transparent 3px);
      opacity:.95;pointer-events:none;
    }
    .winner-content{position:relative;z-index:1;display:grid;gap:12px;justify-items:center}
    .winner-title{margin:0;font-size:clamp(3rem,9vw,8.4rem);line-height:.88;font-weight:900;letter-spacing:.04em;color:#fff7d8;text-transform:uppercase;text-shadow:0 0 24px rgba(212,175,55,.32)}
    .winner-sub{margin:0;color:var(--gold-strong);font-size:clamp(1rem,2vw,1.5rem);font-weight:800;letter-spacing:.24em;text-transform:uppercase}
    .winner-prize{margin:0;font-size:clamp(2rem,5vw,4.6rem);font-weight:900;line-height:1.02;max-width:88%;text-shadow:0 4px 16px rgba(0,0,0,.45)}
    .winner-countdown{margin-top:4px;color:var(--muted);font-size:clamp(1rem,1.6vw,1.25rem)}
    .winner-tap{color:var(--gold-strong);font-size:clamp(.95rem,1.5vw,1.12rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.95}
    .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .confetti span{position:absolute;top:-10%;width:12px;height:28px;border-radius:999px;opacity:.9;animation:fall linear forwards}
    @keyframes fall{0%{transform:translateY(-10vh) rotate(0)}10%{opacity:1}100%{transform:translateY(115vh) rotate(360deg);opacity:.95}}
    @media (max-width:760px){
      .screen{padding:10px}
      .frame{height:calc(100vh - 20px);padding:14px 14px 12px;border-radius:28px}
      .topbar{align-items:flex-start;flex-wrap:wrap}
      .top-actions{width:100%;justify-content:flex-start}
      .title{font-size:2.4rem}
      .board-shell{padding:10px}
      .board{gap:8px;width:min(100%, 66vh)}
      .tile{border-radius:16px;padding:8px}
      .tile-text{font-size:clamp(11px,2.4vw,18px)}
      .center-card{padding:12px 10px 10px}
      .result{font-size:clamp(1.2rem,4.2vw,2.4rem)}
      .main-btn{width:112px;height:112px;font-size:2rem}
      .main-btn.stop{width:136px;height:82px;font-size:1rem}
      .brand-lockup img{max-width:82vw}
      .winner-card{min-height:320px;padding:26px 18px}
    }
  </style>
</head>

      <section class="board-area">

        } else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
        else { current += ch; }
      }
      result.push(current.trim());
      return result;
    }
    function weightedPick(pool) {
      const expanded = [];
      pool.forEach(item => {
        const weight = Math.max(1, parseInt(item.weight || 1, 10));
        for (let i = 0; i < weight; i++) expanded.push(item);
      });
      return expanded[Math.floor(Math.random() * expanded.length)];
    }
    function buildRingPrizes(pool) {
      const next = [];
      for (let i = 0; i < ringCellIndices.length; i++) next.push({ ...weightedPick(pool) });
      return next;
    }
    function loadSettings() {
      try { return { ...DEFAULT_SETTINGS, ...(JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}) }; }
      catch { return { ...DEFAULT_SETTINGS }; }
    }
    function applySettings() {
      const settings = loadSettings();
      state.randomMode = !!settings.luckyLoopRandomPath;
      state.muted = !settings.luckyLoopSound;
      state.autoReturnEnabled = !!settings.autoReturnEnabled;
      state.autoReturnSeconds = Math.max(3, Math.min(60, parseInt(settings.autoReturnSeconds || 10, 10)));
      settingsReadout.textContent = state.autoReturnEnabled
        ? `Auto-return is on · ${state.autoReturnSeconds}s after each reveal · ${state.randomMode ? 'Random path' : 'Standard path'} · Sound ${state.muted ? 'off' : 'on'}`
        : `${state.randomMode ? 'Random path' : 'Standard path'} · Sound ${state.muted ? 'off' : 'on'} · Auto-return off`;
    }
    function ensureAudio() {
      if (!state.audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) state.audioCtx = new Ctx();
      }
      return state.audioCtx;
    }
    function unlockAudio() {
      const ctx = ensureAudio(); if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    }
    function beep(step = 0) {
      if (state.muted) return;
      const ctx = ensureAudio(); if (!ctx || ctx.state !== 'running') return;
      const freq = [523.25, 587.33, 659.25, 783.99, 987.77][step % 5];
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(0.04, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.09);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.1);
    }
    function winSound() {
      if (state.muted) return;
      const ctx = ensureAudio(); if (!ctx || ctx.state !== 'running') return;
      [659.25, 783.99, 987.77, 1046.5].forEach((f, i) => {
        const o = ctx.createOscillator(); const g = ctx.createGain(); const t = ctx.currentTime + i * 0.08;
        o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.055, t); g.gain.exponentialRampToValueAtTime(0.00001, t + 0.24);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.25);
      });
    }
    function clearTimers() {
      if (state.tickTimer) clearTimeout(state.tickTimer);
      if (state.shuffleTimer) clearInterval(state.shuffleTimer);
      if (state.returnTimer) clearTimeout(state.returnTimer);
      if (state.returnInterval) clearInterval(state.returnInterval);
      state.tickTimer = null; state.shuffleTimer = null; state.returnTimer = null; state.returnInterval = null;
    }
    function styleTile(tile, prize) {
      const accent = ACCENTS[prize?.accent] || ACCENTS.neutral;
      tile.style.background = `radial-gradient(circle at 50% 18%, rgba(255,255,255,.10), transparent 38%), ${accent.base}`;
      tile.style.boxShadow = `inset 0 0 0 1px rgba(255,255,255,.03), 0 0 18px ${accent.glow}, 0 0 18px rgba(0,0,0,.45)`;
      tile.style.color = accent.text;
      tile.style.setProperty('color', accent.glow);
      tile.querySelector('.tile-text').style.color = accent.text;
    }
    function updateActiveTile() {
      for (const [cellIndex, tile] of ui.tilesByCell.entries()) {
        const ringPos = cellToRingPos.get(cellIndex);
        tile.classList.toggle('active', ringPos === state.activeRingPos);
      }
    }
    function updateCenter() {
      if (state.actionMode === 'spin') {
        ui.mainButton.textContent = 'Spin';
        ui.mainButton.className = 'main-btn';
        ui.mainButton.disabled = state.isSpinning;
      } else {
        ui.mainButton.textContent = 'Stop';
        ui.mainButton.className = 'main-btn stop' + (state.stopRequested ? ' disabled' : '');
        ui.mainButton.disabled = state.stopRequested;
      }
      ui.result.textContent = state.lastWin || (state.stopRequested ? 'Slowing down…' : 'Tap spin to begin');
      ui.helper.textContent = state.autoReturnEnabled
        ? `Auto-return is on · ${state.autoReturnSeconds}s after reveal`
        : 'Auto-return is off';
      fullscreenBtn.textContent = document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen';
    }
    function render() { updateActiveTile(); updateCenter(); }
    function applyPrizeTextAndColors() {
      for (const [cellIndex, tile] of ui.tilesByCell.entries()) {
        const ringPos = cellToRingPos.get(cellIndex); const prize = state.ringPrizes[ringPos];
        tile.querySelector('.tile-text').textContent = prize?.label || '';
        styleTile(tile, prize);
      }
    }
    function createConfetti() {
      confettiEl.innerHTML = '';
      const colors = ['#d4af37', '#f1d274', '#ffffff', '#f8d88a'];
      for (let i = 0; i < 26; i++) {
        const span = document.createElement('span');
        span.style.left = `${Math.random() * 100}%`;
        span.style.background = colors[i % colors.length];
        span.style.animationDuration = `${3 + Math.random() * 1.6}s`;
        span.style.animationDelay = `${Math.random() * .35}s`;
        span.style.transform = `rotate(${Math.random() * 360}deg)`;
        confettiEl.appendChild(span);
      }
    }
    function goHome() { window.location.href = 'index.html'; }
    function showWinner(prize) {
      clearTimeout(state.returnTimer); clearInterval(state.returnInterval);
      state.returnTimer = null; state.returnInterval = null;
      winnerPrizeEl.textContent = prize;
      winnerOverlay.classList.add('show');
      winnerOverlay.setAttribute('aria-hidden', 'false');
      createConfetti();
      if (!state.autoReturnEnabled) {
        winnerCountdownEl.textContent = '';
        winnerTapHintEl.textContent = 'Tap anywhere to play again';
        return;
      }
      let remain = state.autoReturnSeconds;
      winnerTapHintEl.textContent = 'Tap anywhere to return now';
      winnerCountdownEl.textContent = `Returning to menu in ${remain}s`;
      state.returnInterval = setInterval(() => {
        remain -= 1;
        if (remain <= 0) {
          clearInterval(state.returnInterval);
          state.returnInterval = null;
          winnerCountdownEl.textContent = 'Returning to menu…';
          return;
        }
        winnerCountdownEl.textContent = `Returning to menu in ${remain}s`;
      }, 1000);
      state.returnTimer = setTimeout(() => {
        clearInterval(state.returnInterval);
        state.returnInterval = null;
        goHome();
      }, state.autoReturnSeconds * 1000);
    }
    function dismissWinnerOverlay() {
      clearTimeout(state.returnTimer); clearInterval(state.returnInterval);
      state.returnTimer = null; state.returnInterval = null;
      winnerOverlay.classList.remove('show');
      winnerOverlay.setAttribute('aria-hidden', 'true');
      winnerCountdownEl.textContent = '';
      winnerTapHintEl.textContent = '';
      if (state.autoReturnEnabled) {
        goHome();
        return;
      }
      resetBoard();
    }
    function finalizeWin() {
      const win = state.currentPrize || state.ringPrizes[state.activeRingPos]?.label || 'Mystery Prize';
      if (win === 'Spin Again') { state.lastWin = 'Spin Again!'; state.actionMode = 'spin'; winSound(); render(); return; }
      if (win === 'Spin Again and Win Double') { state.lastWin = 'Spin Again & Win Double!'; state.doubleNext = true; state.actionMode = 'spin'; winSound(); render(); return; }
      state.lastWin = state.doubleNext ? `${win} (Double!)` : win;
      state.doubleNext = false;
      state.actionMode = 'spin';
      winSound();
      render();
      setTimeout(() => showWinner(state.lastWin), 220);
    }
    function stepOnce() {
      if (state.randomMode) {
        let next = Math.floor(Math.random() * ringCellIndices.length);
        if (next === state.activeRingPos) next = (next + 1) % ringCellIndices.length;
        state.activeRingPos = next;
      } else state.activeRingPos = (state.activeRingPos + 1) % ringCellIndices.length;
      state.currentPrize = state.ringPrizes[state.activeRingPos]?.label || '';
      beep(state.activeRingPos);
      if (state.stopRequested) {
        state.stopCountdown -= 1;
        state.speed = Math.min(420, state.speed + 70);
        if (state.stopCountdown <= 0) {
          state.isSpinning = false; state.stopRequested = false; state.stopCountdown = null; state.tickTimer = null;
          render(); setTimeout(finalizeWin, 220); return;
        }
      } else state.speed = Math.max(state.randomMode ? 90 : 62, state.speed - 6);
      render(); state.tickTimer = setTimeout(stepOnce, state.speed);
    }
    function startSpinLoop() { state.isSpinning = true; state.speed = state.randomMode ? 140 : 110; state.tickTimer = setTimeout(stepOnce, state.speed); render(); }
    function startSpin() {
      unlockAudio();
      if (state.actionMode !== 'spin' || state.isSpinning) return;
      clearTimers(); winnerOverlay.classList.remove('show'); winnerOverlay.setAttribute('aria-hidden', 'true');
      state.lastWin = null; state.isSpinning = true; state.stopRequested = false; state.stopCountdown = null; state.actionMode = 'stop';
      render();
      let ticks = 0;
      state.shuffleTimer = setInterval(() => {
        state.ringPrizes = buildRingPrizes(state.prizes);
        applyPrizeTextAndColors();
        ticks += 1; beep(ticks);
        if (ticks >= 12) {
          clearInterval(state.shuffleTimer); state.shuffleTimer = null;
          state.activeRingPos = Math.floor(Math.random() * ringCellIndices.length);
          state.currentPrize = state.ringPrizes[state.activeRingPos]?.label || '';
          render(); startSpinLoop();
        }
      }, 60);
    }
    function requestStop(ev) {
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      unlockAudio();
      if (state.actionMode !== 'stop' || state.stopRequested) return;
      state.stopRequested = true; state.stopCountdown = 4; render();
    }
    function resetBoard() {
      unlockAudio(); clearTimers(); winnerOverlay.classList.remove('show'); winnerOverlay.setAttribute('aria-hidden', 'true');
      state.activeRingPos = 0; state.isSpinning = false; state.stopRequested = false; state.stopCountdown = null;
      state.actionMode = 'spin'; state.lastWin = null; state.doubleNext = false; state.currentPrize = ''; state.speed = 120;
      applySettings(); state.ringPrizes = buildRingPrizes(state.prizes); applyPrizeTextAndColors(); render();
    }
    function toggleFullScreen() {
      unlockAudio();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
      setTimeout(render, 60);
    }
    function buildBoard() {
      boardEl.innerHTML = '';
      ui.tilesByCell = new Map();
      for (let cellIndex = 0; cellIndex < N * N; cellIndex++) {
        const r = Math.floor(cellIndex / N), c = cellIndex % N;
        const inCenter = r >= 1 && r <= 3 && c >= 1 && c <= 3;
        if (inCenter && r === 1 && c === 1) {
          const center = document.createElement('div'); center.className = 'center-card';
          const top = document.createElement('div'); top.className = 'center-top';
          const mark = document.createElement('div'); mark.className = 'center-mark'; mark.textContent = 'Lucky Loop'; top.appendChild(mark);
          const mid = document.createElement('div'); mid.className = 'center-mid';
          const result = document.createElement('div'); result.className = 'result'; ui.result = result; mid.appendChild(result);
          const btn = document.createElement('button'); btn.className = 'main-btn'; btn.type = 'button';
          btn.addEventListener('click', () => state.actionMode === 'spin' ? startSpin() : requestStop());
          btn.addEventListener('pointerdown', (e) => { if (state.actionMode === 'stop') requestStop(e); });
          ui.mainButton = btn; mid.appendChild(btn);
          const helper = document.createElement('div'); helper.className = 'helper'; ui.helper = helper; mid.appendChild(helper);
          const bottom = document.createElement('div'); bottom.className = 'center-bottom';
          const reset = document.createElement('button'); reset.className = 'control-btn'; reset.type = 'button'; reset.textContent = 'Reset'; reset.addEventListener('click', resetBoard);
          const home = document.createElement('button'); home.className = 'control-btn'; home.type = 'button'; home.textContent = 'Home'; home.addEventListener('click', goHome);
          bottom.append(reset, home);
          center.append(top, mid, bottom); boardEl.appendChild(center); continue;
        }
        if (inCenter) continue;
        const tile = document.createElement('div'); tile.className = 'tile';
        const text = document.createElement('div'); text.className = 'tile-text'; tile.appendChild(text);
        boardEl.appendChild(tile); ui.tilesByCell.set(cellIndex, tile);
      }
    }
    async function loadSheet() {
      try {
        const res = await fetch(SHEET_URL);
        const csv = (await res.text()).replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
        const lines = csv.split('\n').filter(Boolean);
        if (!lines.length) throw new Error('No rows');
        const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase().trim());
        const rows = lines.slice(1).map(parseCsvLine);
        const idx = {
          active: headers.findIndex(h => h.includes('active')),
          label: headers.findIndex(h => h.includes('prize label')),
          accent: headers.findIndex(h => h === 'accent' || h.includes('accent')),
          weight: headers.findIndex(h => h === 'weight' || h.includes('weight'))
        };
        const parsed = rows.map(cols => ({
          active: (cols[idx.active] || 'yes').toLowerCase(),
          label: (cols[idx.label] || '').trim(),
          accent: (cols[idx.accent] || 'neutral').trim().toLowerCase(),
          weight: parseInt(cols[idx.weight] || '1', 10) || 1
        })).filter(r => r.label && r.active !== 'no' && r.active !== 'false' && r.active !== '0');
        if (parsed.length >= ringCellIndices.length) state.prizes = parsed;
      } catch (e) {
        console.warn('Using fallback prizes', e);
      }
      state.ringPrizes = buildRingPrizes(state.prizes);
      applyPrizeTextAndColors(); render();
    }

    homeBtn.addEventListener('click', goHome);
    resetTopBtn.addEventListener('click', resetBoard);
    fullscreenBtn.addEventListener('click', toggleFullScreen);
    document.addEventListener('fullscreenchange', render);
    document.addEventListener('pointerdown', unlockAudio, { passive: true });
    winnerOverlay.addEventListener('click', dismissWinnerOverlay);
    winnerOverlay.addEventListener('pointerdown', (e) => { e.preventDefault(); dismissWinnerOverlay(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && winnerOverlay.classList.contains('show')) dismissWinnerOverlay();
    });

    applySettings();
    buildBoard();
    state.ringPrizes = buildRingPrizes(state.prizes);
    applyPrizeTextAndColors();
    render();
    loadSheet();
  </script>
</body>
