<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lucky Loop</title><style>
:root{--gold:#d4af37;--gold2:#f5df92;--text:#f7f0e6;--muted:#d0c7b6;--line:rgba(212,175,55,.22);}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 8%, rgba(212,175,55,.12), transparent 22%),linear-gradient(180deg,#111,#040404);color:var(--text);overflow:hidden}.screen{height:100vh;padding:12px;display:grid;place-items:center}.frame{position:relative;width:min(100%,980px);height:min(calc(100vh - 24px),1600px);padding:14px;border-radius:34px;border:1px solid var(--line);background:linear-gradient(180deg, rgba(18,18,18,.995), rgba(5,5,5,.998));box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), inset 0 0 80px rgba(212,175,55,.05), 0 0 40px rgba(212,175,55,.10);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.frame:before{content:'';position:absolute;inset:8px;border-radius:28px;border:1px solid rgba(212,175,55,.10);pointer-events:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eyebrow{color:var(--gold);font-size:clamp(11px,1vw,15px);letter-spacing:.26em;text-transform:uppercase;font-weight:800}h1{margin:2px 0 0;font-size:clamp(42px,6.6vw,84px);line-height:.92;font-weight:900;letter-spacing:-.04em}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1a1a1a,#0d0d0d);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(14px,1.3vw,21px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}.main{display:grid;grid-template-rows:auto 1fr auto;gap:12px;align-items:start;min-height:0}.board-wrap{display:grid;place-items:center}.board{width:min(95vw,720px);height:min(95vw,720px);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:10px;position:relative;padding:8px;border-radius:28px;border:1px solid rgba(212,175,55,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 0 28px rgba(212,175,55,.08)}.tile{border-radius:22px;display:grid;place-items:center;text-align:center;padding:8px 6px;font-weight:900;font-size:clamp(15px,2vw,28px);line-height:.96;color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 0 18px rgba(0,0,0,.4);position:relative;overflow:hidden}.tile:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 24%, rgba(255,255,255,.18), transparent 32%);opacity:.55}.tile.active{outline:4px solid #fff; outline-offset:-4px; box-shadow:0 0 0 2px rgba(255,255,255,.2) inset, 0 0 28px rgba(255,255,255,.42), 0 0 34px rgba(255,255,255,.4); transform:scale(1.02)}.tile .txt{position:relative;z-index:1;max-width:92%}.center{grid-column:2 / span 3; grid-row:2 / span 3; border-radius:30px; border:1px solid rgba(212,175,55,.16); background:radial-gradient(circle at 50% 20%, rgba(212,175,55,.08), transparent 36%), linear-gradient(180deg,#090909,#030303); box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 0 34px rgba(0,0,0,.4); display:grid; align-content:center; justify-items:center; gap:16px; padding:20px 12px; text-align:center}.center .mini{color:var(--gold);font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(12px,1vw,16px)}.result{font-size:clamp(30px,6vw,72px);font-weight:900;line-height:.92;letter-spacing:-.04em;max-width:92%;text-shadow:0 3px 12px rgba(0,0,0,.45);min-height:1.8em;display:grid;place-items:center}.primary{width:min(24vw,170px);height:min(24vw,170px);min-width:104px;min-height:104px;border:none;border-radius:50%;background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);color:#101010;font-size:clamp(20px,4vw,44px);font-weight:900;cursor:pointer;box-shadow:0 0 30px rgba(212,175,55,.55), inset 0 2px 10px rgba(255,255,255,.48), 0 12px 30px rgba(0,0,0,.45)}.primary.stop{background:radial-gradient(circle at 34% 30%, #ffcbc0 0%, #ff6d53 34%, #d22b1d 78%, #8f120d 100%); color:white; box-shadow:0 0 32px rgba(255,73,54,.55), inset 0 2px 10px rgba(255,255,255,.36), 0 12px 30px rgba(0,0,0,.45)}.center-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.small{border:1px solid rgba(255,255,255,.10);background:#121212;color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}.status{text-align:center;color:var(--muted);font-size:clamp(14px,1.5vw,22px)}.footer{display:grid;justify-items:center;gap:10px}.footer img{max-width:min(56vw,430px);width:100%;height:auto}.footer-copy{font-size:clamp(12px,1.1vw,18px);color:#d4ccbf;text-align:center}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:26px;z-index:50}.overlay.show{display:flex}.overlay-card{width:min(90%,920px);border-radius:34px;border:1px solid rgba(212,175,55,.36);background:radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%),linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)),#080808;box-shadow:0 0 0 1px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.16);padding:42px 28px;text-align:center}.winner{font-size:clamp(48px,10vw,140px);font-weight:900;line-height:.88;margin:0;letter-spacing:-.04em;text-shadow:0 0 18px rgba(255,245,200,.18)}.congrats{color:var(--gold2);font-size:clamp(24px,3vw,46px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;margin-top:14px}.prize{font-size:clamp(34px,6vw,84px);font-weight:900;line-height:1;margin-top:24px}.returning{color:#ddd5c9;font-size:clamp(18px,2.2vw,30px);margin-top:18px}@media (max-width:760px){.screen{padding:8px}.frame{height:calc(100vh - 16px);padding:10px}.board{gap:8px}.tile{font-size:clamp(13px,2.6vw,20px);border-radius:18px}.center{border-radius:24px}.btn{padding:10px 12px}}</style></head><body><div class="screen"><main class="frame"><section class="top"><div><div class="eyebrow">Bonvoy Rewards Play</div><h1>Lucky Loop</h1></div><div class="controls"><button class="btn" id="homeBtn">Home</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="fsBtn">Full Screen</button></div></section><section class="main"><div class="board-wrap"><div class="board" id="board"></div></div><div class="footer"><img src="BONVOY_LOGO_2C_REV_RGB.png" alt="Marriott Bonvoy" onerror="this.style.display='none'"><div class="footer-copy" id="footerCopy">Ready to play</div></div></section><div class="overlay" id="overlay"><div class="overlay-card"><h2 class="winner">WINNER</h2><div class="congrats">Congratulations</div><div class="prize" id="overlayPrize">Prize</div><div class="returning" id="overlayReturn">Tap to continue</div></div></div></main></div><script>

const SETTINGS_KEY = 'bonvoyRewardsPlaySettings';
const PRIZE_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";
const DEFAULT_SETTINGS = { soundOn: true, randomPath: false, popupSeconds: 8, afterWinAction: 'menu' };
const DEFAULT_PRIZES = [
  {label:'500 Points', accent:'blue'}, {label:'1,000 Points', accent:'blue'}, {label:'1,500 Points', accent:'blue'},
  {label:'2,500 Points', accent:'purple'}, {label:'Free Parking', accent:'teal'}, {label:'Free Appetizer', accent:'amber'},
  {label:'Starbucks Drink', accent:'amber'}, {label:'Breakfast for 2', accent:'teal'}, {label:'Late Checkout', accent:'gold'},
  {label:'Gift Shop Snack/Drink', accent:'amber'}, {label:'Bonus Treat', accent:'teal'}, {label:'Room Upgrade', accent:'gold'},
  {label:'Spin Again', accent:'purple'}, {label:'Spin Again and Win Double', accent:'purple'}
];
const ACCENT_COLORS = { blue:'#154fa7', teal:'#0d6a63', purple:'#6e2cb0', amber:'#915112', gold:'#6e5b19', neutral:'#3b3b3b' };
function loadSettings(){ try{ const raw=localStorage.getItem(SETTINGS_KEY); const parsed=raw?JSON.parse(raw):{}; return {...DEFAULT_SETTINGS, ...parsed, popupSeconds:Math.max(3, Math.min(20, Number(parsed.popupSeconds ?? DEFAULT_SETTINGS.popupSeconds)))}; } catch(e){ return {...DEFAULT_SETTINGS}; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function parseCsvLine(line){ const result=[]; let current='', inQuotes=false; for(let i=0;i<line.length;i++){ const ch=line[i], next=line[i+1]; if(ch==='"'){ if(inQuotes && next==='"'){ current+='"'; i++; } else inQuotes=!inQuotes; } else if(ch===',' && !inQuotes){ result.push(current.trim()); current=''; } else current+=ch; } result.push(current.trim()); return result; }
function normalizeAccent(a){ const k=(a||'').toLowerCase(); return ACCENT_COLORS[k] ? k : 'blue'; }
async function fetchPrizeRows(){
  try{
    const res = await fetch(PRIZE_CSV, {cache:'no-store'}); const text = await res.text();
    const lines = text.replace(/^\uFEFF/, '').trim().split(/\r?\n/).filter(Boolean); if(!lines.length) throw new Error('empty csv');
    const headers = parseCsvLine(lines[0]).map(h=>h.toLowerCase());
    const idx = { active: headers.indexOf('active'), label: headers.indexOf('prize label'), accent: headers.indexOf('accent') };
    const rows = lines.slice(1).map(parseCsvLine).map(cols => {
      const active = idx.active >= 0 ? (cols[idx.active] || '').trim().toLowerCase() : 'yes';
      const label = idx.label >= 0 ? (cols[idx.label] || '').trim() : (cols[0] || '').trim();
      const accent = idx.accent >= 0 ? normalizeAccent(cols[idx.accent] || '') : 'blue';
      return {active, label, accent};
    }).filter(r => r.label && (!r.active || r.active === 'yes' || r.active === 'true' || r.active === '1'));
    return rows.length ? rows : DEFAULT_PRIZES;
  }catch(err){ console.warn('Prize feed fallback', err); return DEFAULT_PRIZES; }
}
function shortPrizeLabel(label){ const map={ 'Gift Shop Snack/Drink':'Gift Shop', 'Spin Again and Win Double':'Double Win', 'Free Appetizer':'Appetizer', 'Breakfast for 2':'Breakfast', 'Late Checkout':'Late Check-out', 'Starbucks Drink':'Coffee', 'Room Upgrade':'Upgrade', 'Free Parking':'Parking', 'Bonus Treat':'Bonus', 'M Club Access':'M Club' }; return map[label] || label.replace(/^Free\s+/,'').replace(/\s+Points$/,' Pts'); }
function escapeHtml(s){ return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function audioTick(freq=720, dur=.07, vol=.05){ if(!loadSettings().soundOn) return; const Ctx = window.AudioContext || window.webkitAudioContext; if(!Ctx) return; if(!window.__ctx) window.__ctx = new Ctx(); const c = window.__ctx; if(c.state === 'suspended') c.resume().catch(()=>{}); const o=c.createOscillator(), g=c.createGain(); o.type='triangle'; o.frequency.value=freq; g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur); }

const board = document.getElementById('board'), overlay = document.getElementById('overlay'), overlayPrize = document.getElementById('overlayPrize'), overlayReturn = document.getElementById('overlayReturn'), footerCopy=document.getElementById('footerCopy'); const homeBtn=document.getElementById('homeBtn'), resetBtn=document.getElementById('resetBtn'), fsBtn=document.getElementById('fsBtn'); const N=5; const ringIndices=[]; for(let c=0;c<N;c++) ringIndices.push(c); for(let r=1;r<N;r++) ringIndices.push(r*N+(N-1)); for(let c=N-2;c>=0;c--) ringIndices.push((N-1)*N+c); for(let r=N-2;r>=1;r--) ringIndices.push(r*N); const cellToRing = new Map(ringIndices.map((cell,i)=>[cell,i])); let settings=loadSettings(), ringPrizes=[], activePos=0, spinning=false, stopRequested=false, timer=null, speed=120, stopCountdown=0, lastPrize='', overlayInterval=null;
function buildBoard(){ board.innerHTML=''; for(let cell=0; cell<N*N; cell++){ const r=Math.floor(cell/N), c=cell%N, center=(r>=1&&r<=3&&c>=1&&c<=3); if(center && r===1 && c===1){ const centerEl=document.createElement('div'); centerEl.className='center'; centerEl.style.gridColumn='2 / span 3'; centerEl.style.gridRow='2 / span 3'; centerEl.innerHTML='<div class="mini">Lucky Loop</div><div class="result" id="resultText">Tap spin to begin</div><button class="primary" id="spinMain">SPIN</button><div class="status" id="statusText"></div><div class="center-actions"><button class="small" id="resetMini">Reset</button><button class="small" id="homeMini">Home</button></div>'; board.appendChild(centerEl);} if(center) continue; const tile=document.createElement('div'); tile.className='tile'; tile.innerHTML='<div class="txt"></div>'; tile.dataset.cell=cell; board.appendChild(tile); } document.getElementById('spinMain').addEventListener('click', onMain); document.getElementById('resetMini').addEventListener('click', resetGame); document.getElementById('homeMini').addEventListener('click', ()=>location.href='index.html'); updateCenter(); }
function tiles(){ return Array.from(board.querySelectorAll('.tile')); } function colorForAccent(a){ return ACCENT_COLORS[a] || ACCENT_COLORS.blue; } function renderTiles(){ tiles().forEach(t=>{ const ringPos=cellToRing.get(Number(t.dataset.cell)); const p=ringPrizes[ringPos]; t.style.background=colorForAccent(p?.accent||'blue'); t.querySelector('.txt').innerHTML=escapeHtml(shortPrizeLabel(p?.label||'')).replace(/ /g,'<br>'); t.classList.toggle('active', ringPos===activePos && spinning); }); }
function updateCenter(){ const result=document.getElementById('resultText'), btn=document.getElementById('spinMain'), status=document.getElementById('statusText'); if(!result||!btn||!status) return; if(spinning){ result.textContent=''; btn.textContent='STOP'; btn.classList.add('stop'); status.textContent=''; } else { btn.textContent='SPIN'; btn.classList.remove('stop'); result.textContent=lastPrize || 'Tap spin to begin'; status.textContent = settings.afterWinAction==='menu' ? 'Popup '+settings.popupSeconds+'s · returns to menu' : 'Popup '+settings.popupSeconds+'s · returns to game'; } footerCopy.textContent = spinning ? 'Loop in motion' : 'Ready to play'; renderTiles(); }
function onMain(){ if(!spinning) startSpin(); else requestStop(); } function startSpin(){ if(spinning) return; settings=loadSettings(); spinning=true; stopRequested=false; stopCountdown=0; speed=settings.randomPath?110:95; lastPrize=''; updateCenter(); step(); } function requestStop(){ stopRequested=true; stopCountdown=4; }
function step(){ activePos = settings.randomPath ? (()=>{ let n=Math.floor(Math.random()*ringPrizes.length); if(n===activePos) n=(n+1)%ringPrizes.length; return n; })() : (activePos+1)%ringPrizes.length; audioTick(650 + (activePos%5)*70,.05,.04); if(stopRequested){ speed=Math.min(390, speed+70); stopCountdown--; } updateCenter(); if(stopRequested && stopCountdown<=0){ spinning=false; stopRequested=false; lastPrize=ringPrizes[activePos].label; updateCenter(); showWinner(lastPrize); return; } timer=setTimeout(step, speed); }
function showWinner(prize){ overlayPrize.textContent = prize; overlay.classList.add('show'); let secs = settings.popupSeconds; overlayReturn.textContent = settings.afterWinAction==='menu' ? 'Returning to menu in '+secs+'s' : 'Returning to game in '+secs+'s'; if(overlayInterval) clearInterval(overlayInterval); overlayInterval=setInterval(()=>{ secs--; overlayReturn.textContent = settings.afterWinAction==='menu' ? 'Returning to menu in '+secs+'s' : 'Returning to game in '+secs+'s'; if(secs<=0){ clearInterval(overlayInterval); overlay.classList.remove('show'); if(settings.afterWinAction==='menu') location.href='index.html'; else resetForNext(); } },1000); }
function resetForNext(){ lastPrize=''; footerCopy.textContent='Ready for next guest'; updateCenter(); } function resetGame(){ if(timer) clearTimeout(timer); if(overlayInterval) clearInterval(overlayInterval); overlay.classList.remove('show'); spinning=false; stopRequested=false; activePos=0; speed=120; lastPrize=''; updateCenter(); } overlay.addEventListener('click', ()=>{ if(overlayInterval) clearInterval(overlayInterval); overlay.classList.remove('show'); if(loadSettings().afterWinAction==='menu') location.href='index.html'; else resetForNext(); }); homeBtn.addEventListener('click', ()=>location.href='index.html'); resetBtn.addEventListener('click', resetGame); fsBtn.addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); });
(async function(){ const prizes = await fetchPrizeRows(); ringPrizes = prizes.slice(0, ringIndices.length); while(ringPrizes.length<ringIndices.length) ringPrizes.push(prizes[ringPrizes.length % prizes.length]); buildBoard(); renderTiles(); })();
</script></body></html>
