<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lucky Loop</title>
<style>
:root{--gold:#d4af37;--gold2:#f1df93;--text:#f7f3ea;--muted:#d0c7b7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 10%, rgba(212,175,55,.14), transparent 26%),linear-gradient(180deg,#121212 0%,#040404 100%);overflow:hidden}.screen{min-height:100%;padding:10px;display:grid;place-items:center}.frame{width:min(96vw,820px);height:min(96vh,1480px);border-radius:28px;border:1px solid rgba(212,175,55,.34);box-shadow:0 0 0 2px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.12),inset 0 0 90px rgba(212,175,55,.05);background:radial-gradient(circle at 50% 7%, rgba(212,175,55,.11), transparent 24%),linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),#060606;position:relative;overflow:hidden;padding:14px 14px 18px;display:grid;grid-template-rows:auto 1fr auto}.frame:before{content:'';position:absolute;inset:8px;border-radius:22px;border:1px solid rgba(212,175,55,.18);pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.25em;text-transform:uppercase;font-size:clamp(12px,1.15vw,18px);margin-bottom:4px}.title{margin:0;line-height:.95;letter-spacing:-.04em;font-size:clamp(44px,6.4vw,84px);font-weight:900}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1a1a1a,#0d0d0d);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(14px,1.35vw,22px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}.main{display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;gap:10px}.board{width:min(92vw,82vh);height:min(92vw,82vh);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:10px}.tile{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(212,175,55,.16);box-shadow:inset 0 0 18px rgba(255,255,255,.05),0 0 18px rgba(0,0,0,.28);padding:8px;display:grid;place-items:center;text-align:center}.tile:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%);pointer-events:none}.tile .inner{display:grid;justify-items:center;align-content:center;gap:5px;position:relative;z-index:2}.tile .icon{width:42px;height:42px;color:#f6e7b2;filter:drop-shadow(0 0 10px rgba(246,231,178,.15))}.tile .label{font-weight:900;line-height:1.02;font-size:clamp(11px,1.4vw,18px);text-shadow:0 2px 6px rgba(0,0,0,.48)}.tile.active{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(255,255,255,.82) inset,0 0 0 2px rgba(212,175,55,.45),0 0 28px 6px rgba(255,255,255,.32),inset 0 0 18px rgba(255,255,255,.08),0 0 18px rgba(0,0,0,.28);animation:pulse .85s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}.center{grid-column:2/span 3;grid-row:2/span 3;border-radius:30px;display:grid;place-items:center;text-align:center;padding:10px;background:radial-gradient(circle at 50% 18%, rgba(212,175,55,.14), transparent 28%), linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), #090909;border:1px solid rgba(212,175,55,.28);box-shadow:0 0 0 1px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.12)}.action-btn{width:min(26vw,180px);height:min(26vw,180px);min-width:120px;min-height:120px;border:none;border-radius:50%;font-size:clamp(28px,4vw,50px);font-weight:900;letter-spacing:-.04em;cursor:pointer;color:#111;background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);box-shadow:0 0 28px rgba(212,175,55,.42), inset 0 2px 10px rgba(255,255,255,.45), 0 10px 30px rgba(0,0,0,.45)}.action-btn.stop{background:radial-gradient(circle at 34% 30%, #ffb8b8 0%, #ef6464 34%, #ad2727 78%, #621010 100%);color:#fff;box-shadow:0 0 28px rgba(220,80,80,.34), inset 0 2px 10px rgba(255,255,255,.25), 0 10px 30px rgba(0,0,0,.45)}.status{text-align:center}.mini{color:var(--gold);font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(11px,1vw,16px);margin-bottom:4px}.headline{font-size:clamp(34px,5.7vw,74px);font-weight:900;line-height:.92;margin:0 12px;text-shadow:0 3px 12px rgba(0,0,0,.45)}.sub{color:var(--muted);font-size:clamp(15px,1.8vw,26px);margin-top:10px}.footer{display:grid;justify-items:center;gap:10px;padding-bottom:2px}.footer img{max-width:min(60vw,420px);width:100%;height:auto;opacity:.96}.footer-note{font-size:clamp(12px,1.15vw,18px);color:#d6d0c3;text-align:center}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:28px;z-index:40}.overlay.show{display:flex}.overlay-card{width:min(90%, 920px);border-radius:34px;border:1px solid rgba(212,175,55,.36);background:radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%), linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), #080808;box-shadow:0 0 0 1px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.16);padding:42px 28px;text-align:center;position:relative;overflow:hidden}.overlay-icon{width:92px;height:92px;margin:0 auto 18px;color:var(--gold2)}.winner{font-size:clamp(48px,10vw,142px);font-weight:900;line-height:.88;margin:0;letter-spacing:-.04em;text-shadow:0 0 18px rgba(255,245,200,.18)}.congrats{color:var(--gold2);font-size:clamp(24px,3.1vw,48px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;margin-top:14px}.prize{font-size:clamp(34px,6vw,84px);font-weight:900;line-height:1;margin-top:24px}.returning{color:#ddd5c9;font-size:clamp(18px,2.2vw,30px);margin-top:18px}.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:100}.confetti{position:absolute;top:-20px;width:10px;height:18px;border-radius:3px;opacity:.9;animation:fall linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:.92}}.accent-blue{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#1c5bb6,#112a58)}.accent-teal{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#167984,#103e43)}.accent-amber{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#a4681d,#5e360d)}.accent-plum{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#7d37a6,#48215e)}.accent-emerald{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#1d6e52,#0f3b2e)}.accent-gold{background:radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 34%),linear-gradient(180deg,#b08b27,#5f4710)} svg{width:100%;height:100%}
</style></head><body>
<div class="screen"><div class="frame"><div class="top"><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title">Lucky<br>Loop</h1></div><div class="controls"><button class="btn" id="homeBtn">Home</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="fsBtn">Full Screen</button></div></div><div class="main"><div id="board" class="board"></div><div class="status"><div class="mini">Lucky Loop</div><div id="headline" class="headline">Tap spin to begin</div><div id="sub" class="sub">Stop the loop to reveal the prize</div></div></div><div class="footer"><img src="BONVOY_LOGO_2C_REV_RGB.png" alt="Marriott Bonvoy"><div id="footerNote" class="footer-note">Ready to play</div></div><div id="overlay" class="overlay"><div class="overlay-card"><div id="overlayIcon" class="overlay-icon"></div><h2 class="winner">WINNER</h2><div class="congrats">Congratulations</div><div id="overlayPrize" class="prize">Prize</div><div class="returning" data-return-text>Returning in 6s</div></div></div></div></div>
<script>
const PRIZE_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";const SETTINGS_KEY='bonvoyRewardsPlaySettingsV2';const DEFAULT_SETTINGS={soundOn:true,popupSeconds:6,afterWinAction:'menu',luckyLoopRandomPath:false};function getSettings(){try{return Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch{return {...DEFAULT_SETTINGS}}}function parseCsvLine(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i],n=line[i+1];if(ch==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){r.push(c.trim());c=''}else c+=ch}r.push(c.trim());return r}function normalize(s){return String(s||'').trim().toLowerCase()}function shortenPrize(label){return String(label).replace(/\bPoints\b/ig,'Pts').replace(/\bBreakfast for Two\b/ig,'Breakfast x2').replace(/\bGift Shop Snack\/Drink\b/ig,'Gift Shop').replace(/\bLate Checkout\b/ig,'Late Check-out').replace(/\s+/g,' ').trim()}function inferIconKey(label){const s=normalize(label);if(s.includes('point'))return'points';if(s.includes('appetizer')||s.includes('dining')||s.includes('dessert'))return'dining';if(s.includes('drink')||s.includes('voucher')||s.includes('bar'))return'drink';if(s.includes('coffee')||s.includes('starbucks'))return'coffee';if(s.includes('breakfast'))return'breakfast';if(s.includes('parking'))return'parking';if(s.includes('club'))return'mclub';if(s.includes('upgrade')||s.includes('suite'))return'upgrade';if(s.includes('gift')||s.includes('snack box'))return'gift';if(s.includes('spin again')||s.includes('double'))return'bonus';if(s.includes('surprise')||s.includes('mystery'))return'surprise';return'star'}function inferAccent(label){const s=normalize(label);if(s.includes('point'))return'blue';if(s.includes('appetizer')||s.includes('dining'))return'teal';if(s.includes('drink')||s.includes('coffee')||s.includes('breakfast')||s.includes('dessert'))return'amber';if(s.includes('parking'))return'emerald';if(s.includes('club')||s.includes('upgrade')||s.includes('suite'))return'gold';if(s.includes('spin again')||s.includes('double'))return'plum';return'blue'}async function loadPrizeMaster(){const fb=['500 Points','Free Appetizer','Late Checkout','Starbucks Drink','Free Parking','Breakfast for Two','2,500 Points','Suite Upgrade','Gift Shop Snack/Drink','Spin Again'].map(label=>({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)}));try{const res=await fetch(PRIZE_CSV,{cache:'no-store'});const txt=await res.text();const lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return fb;const headers=parseCsvLine(lines[0]).map(normalize);const iActive=headers.indexOf('active'),iLabel=headers.indexOf('prize label');const out=[];for(const line of lines.slice(1)){const cols=parseCsvLine(line);const active=iActive>=0?normalize(cols[iActive]):'yes';const label=(cols[iLabel>=0?iLabel:1]||cols[0]||'').trim();if(!label)continue;if(iActive>=0&&!['yes','true','1','y'].includes(active))continue;out.push({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)})}return out.length?out:fb}catch{return fb}}function fullScreenToggle(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}function iconSvg(key){const common='viewBox="0 0 64 64" aria-hidden="true"';const i={points:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="8"/><path d="M16 18v18c0 4.4 7.2 8 16 8s16-3.6 16-8V18"/><path d="M16 27c0 4.4 7.2 8 16 8s16-3.6 16-8"/></g></svg>`,star:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M32 9l6.7 13.6L54 25l-11 10.7 2.6 15.3L32 44l-13.6 7 2.6-15.3L10 25l15.3-2.4z"/></svg>`,gift:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="24" width="40" height="26" rx="4"/><path d="M32 24v26M12 33h40"/><path d="M32 24s-11-2-11-8c0-3 2.4-5 5.4-5 4.2 0 5.6 5.2 5.6 5.2S33.4 11 37.6 11C40.6 11 43 13 43 16c0 6-11 8-11 8z"/></g></svg>`,surprise:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M32 11v14M32 39v14M11 32h14M39 32h14"/><path d="M18 18l6 6M40 40l6 6M46 18l-6 6M24 40l-6 6"/></g></svg>`,dining:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v22M15 10v10M20 20h-5M25 10v10"/><path d="M43 10c4 6 4 12 0 18v26"/><path d="M20 32v22"/></g></svg>`,drink:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h32l-8 14H24z"/><path d="M32 28v16"/><path d="M24 50h16"/><path d="M44 14l6-6"/></g></svg>`,coffee:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 22h26v14a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z"/><path d="M42 25h4a7 7 0 0 1 0 14h-4"/><path d="M22 12c0 4 4 4 4 8M30 12c0 4 4 4 4 8"/></g></svg>`,breakfast:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 42c5-12 27-12 32 0"/><path d="M12 42h40"/><path d="M25 28a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/><path d="M40 30c5 0 8-3.4 8-8"/></g></svg>`,parking:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="10" width="36" height="44" rx="6"/><path d="M25 44V20h11a7 7 0 0 1 0 14H25"/></g></svg>`,mclub:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M12 46h40l-4-24-12 10-8-14-8 14-8-10z"/></svg>`,upgrade:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42l12-20 12 20"/><path d="M32 20v24"/><path d="M48 16l4-4m0 0l4 4m-4-4v12"/></g></svg>`,bonus:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M19 20v10M14 25h10M39 34v10M34 39h10"/><path d="M32 10l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g></svg>`};return i[key]||i.star}function confettiBurst(target){const wrap=document.createElement('div');wrap.className='confetti-wrap';for(let i=0;i<80;i++){const p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.8+Math.random()*1.1)+'s';p.style.background=['#d4af37','#f1df93','#b07a1c','#1d5e90','#1f766a','#7b38a3'][Math.floor(Math.random()*6)];wrap.appendChild(p)}target.appendChild(wrap);setTimeout(()=>wrap.remove(),3400)}function scheduleAfterWin(closeFn){const s=getSettings();let r=Math.max(1,Number(s.popupSeconds)||6);const el=document.querySelector('[data-return-text]');if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`;const t=setInterval(()=>{r--;if(r<=0){clearInterval(t);closeFn()}else if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`},1000);return t}
const N=5;const ring=[];for(let c=0;c<N;c++)ring.push(c);for(let r=1;r<N;r++)ring.push(r*N+N-1);for(let c=N-2;c>=0;c--)ring.push((N-1)*N+c);for(let r=N-2;r>=1;r--)ring.push(r*N);let prizes=[],ringPrizes=[],active=0,spinning=false,stopRequested=false,speed=120,stopCountdown=0,spinTimer=null,winTimer=null;const board=document.getElementById('board'),headline=document.getElementById('headline'),sub=document.getElementById('sub'),footerNote=document.getElementById('footerNote'),overlay=document.getElementById('overlay'),overlayIcon=document.getElementById('overlayIcon'),overlayPrize=document.getElementById('overlayPrize');const tiles=new Map();function renderBoard(){board.innerHTML='';tiles.clear();for(let i=0;i<25;i++){const r=Math.floor(i/5),c=i%5,inCenter=r>=1&&r<=3&&c>=1&&c<=3;if(inCenter&&r===1&&c===1){const center=document.createElement('div');center.className='center';center.innerHTML='<div><button id="actionBtn" class="action-btn">SPIN</button><div style="margin-top:16px;font-size:clamp(22px,3vw,38px);font-weight:900" id="centerStatus">Tap spin to begin</div></div>';board.appendChild(center);continue}if(inCenter)continue;const p=ringPrizes[ring.indexOf(i)]||{label:'Prize',icon:'star',accent:'blue',short:'Prize'};const tile=document.createElement('div');tile.className='tile accent-'+p.accent;tile.innerHTML='<div class="inner"><div class="icon">'+iconSvg(p.icon)+'</div><div class="label">'+(p.short||shortenPrize(p.label))+'</div></div>';board.appendChild(tile);tiles.set(i,tile)}bindCenter();updateActive()}function bindCenter(){const btn=document.getElementById('actionBtn'),status=document.getElementById('centerStatus');if(!btn)return;btn.textContent=spinning?'STOP':'SPIN';btn.classList.toggle('stop',spinning);status.textContent=spinning?'':'Tap spin to begin';btn.onclick=()=>spinning?requestStop():startSpin()}function updateActive(){tiles.forEach((el,cell)=>el.classList.toggle('active',ring[active]===cell))}function setTexts(h,s,f){headline.textContent=h;sub.textContent=s;footerNote.textContent=f}function clearSpin(){if(spinTimer)clearTimeout(spinTimer);spinTimer=null}function step(){const settings=getSettings();active=settings.luckyLoopRandomPath?(()=>{let n=Math.floor(Math.random()*ring.length);if(n===active)n=(n+1)%ring.length;return n})():(active+1)%ring.length;updateActive();if(stopRequested){stopCountdown--;speed=Math.min(420,speed+75);if(stopCountdown<=0){spinning=false;stopRequested=false;clearSpin();bindCenter();showWinner(ringPrizes[active]);return}}else speed=Math.max(settings.luckyLoopRandomPath?95:60,speed-6);spinTimer=setTimeout(step,speed)}function startSpin(){if(spinning)return;spinning=true;stopRequested=false;speed=110;setTexts('Spinning…','Good luck','Loop in motion');bindCenter();clearSpin();spinTimer=setTimeout(step,speed)}function requestStop(){if(!spinning||stopRequested)return;stopRequested=true;stopCountdown=4;setTexts('Stopping…','Landing the prize','Loop slowing down');bindCenter()}function showWinner(prize){overlayIcon.innerHTML=iconSvg(prize.icon);overlayPrize.textContent=prize.label;overlay.classList.add('show');confettiBurst(overlay.querySelector('.overlay-card'));setTexts(prize.label,'Winner selected','Tap anywhere to continue');if(winTimer)clearInterval(winTimer);winTimer=scheduleAfterWin(closeWinner)}function closeWinner(){if(winTimer)clearInterval(winTimer);overlay.classList.remove('show');if(getSettings().afterWinAction==='menu')location.href='index.html';else resetGame()}function resetGame(){clearSpin();spinning=false;stopRequested=false;active=0;setTexts('Tap spin to begin','Stop the loop to reveal the prize','Ready to play');renderBoard()}document.getElementById('homeBtn').onclick=()=>location.href='index.html';document.getElementById('resetBtn').onclick=resetGame;document.getElementById('fsBtn').onclick=fullScreenToggle;overlay.onclick=closeWinner;(async()=>{prizes=await loadPrizeMaster();ringPrizes=prizes.slice(0,ring.length);while(ringPrizes.length<ring.length)ringPrizes.push(prizes[ringPrizes.length%prizes.length]);renderBoard()})();
</script></body></html>
