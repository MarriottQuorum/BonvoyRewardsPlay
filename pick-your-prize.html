<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pick Your Prize</title><link rel="stylesheet" href="shared.css"></head><body><div class="screen"><div class="frame"><div class="topbar"><div class="leftbrand"><a class="backlink" href="index.html">← Menu</a><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title smalltitle">Pick Your Prize</h1></div></div><div class="controls"><button class="btn" id="headerFs">Full Screen</button></div></div><div class="content game-shell"><div class="subhead"><div class="subcopy">Functional placeholder inspired by the premium suitcase mocks.</div><div class="badge">Shared Prize Pool</div></div><div class="game-stage"><div class="toolbar"><div class="badge">5 Premium Cases</div><div class="badge" id="pickReadout">Pick one suitcase</div></div><div id="caseRow" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:calc(100% - 56px);align-items:end;margin-top:12px"></div></div><div class="footer"><img class="logo" src="BONVOY_LOGO_2C_REV_RGB(1).png" alt="Marriott Bonvoy"></div></div></div></div><script src="shared.js"></script><script>installCommonUI();
(async()=>{
 const prizes=await loadPrizes(); const overlay=createPopupOverlay(); const row=document.getElementById('caseRow'); const readout=document.getElementById('pickReadout'); const choices=prizes.slice(0,5).sort(()=>Math.random()-0.5);
 choices.forEach((p,i)=>{ const b=document.createElement('button'); b.className='btn'; b.style.height=(55+i*7)+'%'; b.style.borderRadius='22px'; b.style.background='linear-gradient(180deg,#1b1b1d,#080809)'; b.style.border='1px solid rgba(255,231,149,.36)'; b.style.boxShadow='inset 0 0 20px rgba(255,255,255,.03), 0 0 20px rgba(0,0,0,.25)'; b.innerHTML='<div style="font-size:46px;color:#f1df93">▣</div><div style="margin-top:10px;font-weight:900">CASE '+(i+1)+'</div>'; b.onclick=()=>reveal(b,p); row.appendChild(b); });
 let done=false; function reveal(btn,p){ if(done) return; done=true; document.querySelectorAll('#caseRow button').forEach(b=>b.disabled=true); btn.style.background='linear-gradient(180deg,#2a2010,#0d0b08)'; btn.innerHTML=`<div style="font-size:44px;color:#f1df93">${iconForType(p.type)}</div><div style="font-size:14px;font-weight:900;margin-top:8px">${p.short}</div>`; readout.textContent=p.label; showPopup(overlay,p.label,'Pick Your Prize reveal!',()=>afterWinGo('pick-your-prize.html')); }
})();</script></body></html>
