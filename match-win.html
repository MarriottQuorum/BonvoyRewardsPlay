<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match & Win</title><link rel="stylesheet" href="shared.css"></head><body><div class="screen"><div class="frame"><div class="topbar"><div class="leftbrand"><a class="backlink" href="index.html">← Menu</a><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title smalltitle">Match & Win</h1></div></div><div class="controls"><button class="btn" id="headerFs">Full Screen</button></div></div><div class="content game-shell"><div class="subhead"><div class="subcopy">Functional placeholder for testing flow, popups, and shared settings.</div><div class="badge">Shared Prize Pool</div></div><div class="game-stage"><div class="toolbar"><div class="badge">2 Matches To Win</div><div class="badge" id="matchReadout">Tap cards to flip</div></div><div id="matchGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;height:calc(100% - 56px);margin-top:12px"></div></div><div class="footer"><img class="logo" src="BONVOY_LOGO_2C_REV_RGB(1).png" alt="Marriott Bonvoy"></div></div></div></div><script src="shared.js"></script><script>installCommonUI();
(async()=>{
 const prizes=await loadPrizes(); const overlay=createPopupOverlay(); const readout=document.getElementById('matchReadout'); const grid=document.getElementById('matchGrid');
 const pick=[prizes[0],prizes[1],prizes[2]]; const deck=[...pick,...pick].sort(()=>Math.random()-0.5); let open=[],lock=false,matches=0;
 deck.forEach((p,i)=>{ const card=document.createElement('button'); card.className='btn'; card.style.height='100%'; card.style.minHeight='120px'; card.style.borderRadius='22px'; card.style.background='linear-gradient(180deg,#121214,#070707)'; card.style.display='grid'; card.style.placeItems='center'; card.dataset.label=p.label; card.dataset.short=p.short; card.dataset.type=p.type; card.dataset.open='0'; card.innerHTML='<div style="font-size:40px;color:#f1df93">✦</div>'; card.onclick=()=>flip(card); grid.appendChild(card);});
 function face(card){ card.innerHTML=`<div style="text-align:center"><div style="font-size:40px;color:#f1df93">${iconForType(card.dataset.type)}</div><div style="font-size:15px;font-weight:900">${card.dataset.short}</div></div>`; card.dataset.open='1'; }
 function back(card){ card.innerHTML='<div style="font-size:40px;color:#f1df93">✦</div>'; card.dataset.open='0'; }
 function flip(card){ if(lock||card.dataset.open==='1') return; face(card); open.push(card); if(open.length<2) return; lock=true; const [a,b]=open; if(a.dataset.label===b.dataset.label){ matches++; readout.textContent=`Match ${matches} of 2`; a.style.outline=b.style.outline='2px solid rgba(255,231,149,.8)'; open=[]; lock=false; if(matches>=2) showPopup(overlay,a.dataset.label,'Match & Win prize!',()=>afterWinGo('match-win.html')); } else setTimeout(()=>{ back(a); back(b); open=[]; lock=false; readout.textContent='Try again'; },700); }
})();</script></body></html>
