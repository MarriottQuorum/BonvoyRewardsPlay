<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Points Jackpot</title><link rel="stylesheet" href="shared.css"></head><body><div class="screen"><div class="frame"><div class="topbar"><div class="leftbrand"><a class="backlink" href="index.html">← Menu</a><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title smalltitle">Points Jackpot</h1></div></div><div class="controls"><button class="btn" id="headerFs">Full Screen</button></div></div><div class="content game-shell"><div class="subhead"><div class="subcopy">Reel-style placeholder for suite-wide testing and shared prize popups.</div><div class="badge">Shared Prize Pool</div></div><div class="game-stage"><div class="toolbar"><div class="badge">3 Reels</div><div class="badge" id="jackReadout">Press spin</div></div><div style="display:grid;grid-template-rows:1fr auto;gap:12px;height:calc(100% - 54px);margin-top:10px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px" id="reels"></div><div style="display:grid;place-items:center"><button class="btn gold" id="jackBtn" style="width:min(60vw,260px);height:76px;border-radius:999px;font-size:30px">SPIN</button></div></div></div><div class="footer"><img class="logo" src="BONVOY_LOGO_2C_REV_RGB(1).png" alt="Marriott Bonvoy"></div></div></div></div><script src="shared.js"></script><script>installCommonUI();
(async()=>{
 const prizes=await loadPrizes(); const overlay=createPopupOverlay(); const reels=document.getElementById('reels'); const btn=document.getElementById('jackBtn'); const readout=document.getElementById('jackReadout'); const cols=[]; const pool=prizes.slice(0,6);
 for(let i=0;i<3;i++){ const col=document.createElement('div'); col.className='score'; col.style.display='grid'; col.style.placeItems='center'; col.style.minHeight='180px'; col.innerHTML='<div style="font-size:42px;color:#f1df93">◎</div><div style="font-size:22px;font-weight:900;margin-top:8px">---</div>'; reels.appendChild(col); cols.push(col);} 
 let spinning=false; btn.onclick=()=>{ if(spinning) return; spinning=true; readout.textContent='Spinning reels'; const result=[]; cols.forEach((col,i)=>{ let steps=14+i*5; const run=()=>{ const p=sample(pool); col.innerHTML=`<div style="font-size:42px;color:#f1df93">${iconForType(p.type)}</div><div style="font-size:22px;font-weight:900;margin-top:8px">${p.short}</div>`; if(steps-->0) setTimeout(run,80+steps*10); else { result[i]=p; if(result.filter(Boolean).length===3){ spinning=false; const same=result.every(x=>x.label===result[0].label); const prize=same?result[0]:sample(result); readout.textContent= same ? 'Jackpot hit' : prize.label; showPopup(overlay, prize.label, same?'Points Jackpot hit!':'Points Jackpot winner!', ()=>afterWinGo('points-jackpot.html')); } };}; run();}); };
})();</script></body></html>
