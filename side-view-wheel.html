<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Side-View Wheel</title><link rel="stylesheet" href="shared.css"></head><body><div class="screen"><div class="frame"><div class="topbar"><div class="leftbrand"><a class="backlink" href="index.html">← Menu</a><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title smalltitle">Side-View Wheel</h1></div></div><div class="controls"><button class="btn" id="headerFs">Full Screen</button></div></div><div class="content game-shell"><div class="subhead"><div class="subcopy">Seasonal two-column option with swipe gesture and side-view physical feel.</div><div class="badge">Shared Prize Pool</div></div><div class="game-stage"><div class="toolbar"><div class="badge">Side-View Wheel Variant</div><div class="badge" id="sideReadout">Swipe left or right to spin</div></div><div class="canvasWrap" style="height:calc(100% - 54px);margin-top:10px"><canvas id="sideCanvas"></canvas><button class="btn gold" id="sideBtn" style="position:absolute;left:50%;bottom:20px;transform:translateX(-50%);border-radius:999px">FLING SPIN</button></div></div><div class="footer"><img class="logo" src="BONVOY_LOGO_2C_REV_RGB(1).png" alt="Marriott Bonvoy"></div></div></div></div><script src="shared.js"></script><script>installCommonUI();
(async()=>{
 const prizes=await loadPrizes(); const overlay=createPopupOverlay(); const canvas=document.getElementById('sideCanvas'); const btn=document.getElementById('sideBtn'); const readout=document.getElementById('sideReadout'); const ctx=canvas.getContext('2d'); const band=prizes.slice(0,8); let w,h,offset=0,vel=0,spinning=false,startX=0;
 function resize(){canvas.width=canvas.clientWidth*devicePixelRatio; canvas.height=canvas.clientHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); w=canvas.clientWidth;h=canvas.clientHeight; draw(); }
 function draw(){ ctx.clearRect(0,0,w,h); const drumY=h*0.48, drumH=Math.min(180,h*0.22), segW=w*0.18; ctx.save(); ctx.translate(0,drumY); const bg=ctx.createLinearGradient(0,-drumH/2,0,drumH/2); bg.addColorStop(0,'#20170a'); bg.addColorStop(.5,'#0c0c0e'); bg.addColorStop(1,'#20170a'); ctx.fillStyle=bg; roundRect(40,-drumH/2,w-80,drumH,drumH/2).fill(); ctx.strokeStyle='rgba(255,232,160,.65)'; ctx.lineWidth=3; roundRect(40,-drumH/2,w-80,drumH,drumH/2).stroke(); for(let i=-2;i<band.length+3;i++){ const x=(i*segW + ((offset%(segW*band.length))+segW*band.length)%(segW*band.length)) - segW; const item=band[((i%band.length)+band.length)%band.length]; const center=x+segW/2; const depth=1-Math.min(.92,Math.abs(center-w/2)/(w/2)); const alpha=.22+.78*depth; if(center<60||center>w-60) continue; ctx.save(); ctx.globalAlpha=alpha; ctx.translate(center,0); ctx.scale(.62+.38*depth,1); const g=ctx.createLinearGradient(0,-drumH/2,0,drumH/2); g.addColorStop(0,['#2858d1','#24a09e','#d08d23','#9047db'][i&3]); g.addColorStop(1,'#111'); ctx.fillStyle=g; roundRect(-segW*.42,-drumH*.36,segW*.84,drumH*.72,18).fill(); ctx.strokeStyle='rgba(255,238,183,.45)'; roundRect(-segW*.42,-drumH*.36,segW*.84,drumH*.72,18).stroke(); ctx.fillStyle='#f8e6a0'; ctx.font='900 30px Arial'; ctx.textAlign='center'; ctx.fillText(iconForType(item.type),0,-8); ctx.fillStyle='#fff'; ctx.font='900 15px Arial'; ctx.fillText(item.short.slice(0,12),0,28); ctx.restore(); }
 ctx.restore(); ctx.fillStyle='#f8e6a0'; ctx.beginPath(); ctx.moveTo(w/2, drumY-drumH*.75); ctx.lineTo(w/2-20, drumY-drumH*.42); ctx.lineTo(w/2+20, drumY-drumH*.42); ctx.closePath(); ctx.fill(); }
 function roundRect(x,y,w,h,r){ const p=new Path2D(); p.moveTo(x+r,y); p.arcTo(x+w,y,x+w,y+h,r); p.arcTo(x+w,y+h,x,y+h,r); p.arcTo(x,y+h,x,y,r); p.arcTo(x,y,x+w,y,r); p.closePath(); return {fill:()=>ctx.fill(p), stroke:()=>ctx.stroke(p)} }
 function step(){ if(!spinning) return; offset+=vel; vel*=0.984; draw(); if(Math.abs(vel)<0.2){ spinning=false; const segW=w*0.18; const normalized=((w/2 - offset)% (segW*band.length)+segW*band.length)%(segW*band.length); const idx=Math.floor(normalized/segW)%band.length; const prize=band[idx]; readout.textContent=prize.label; showPopup(overlay, prize.label, 'Side-view wheel landed!', ()=>afterWinGo('side-view-wheel.html')); return; } requestAnimationFrame(step); }
 function startSpin(power){ if(spinning) return; spinning=true; vel=power; readout.textContent='Wheel in motion'; requestAnimationFrame(step); }
 btn.onclick=()=>startSpin(28+Math.random()*12);
 canvas.addEventListener('pointerdown',e=>{startX=e.clientX;});
 canvas.addEventListener('pointerup',e=>{ const dx=e.clientX-startX; if(Math.abs(dx)>25) startSpin(dx/5); });
 window.addEventListener('resize',resize); resize();
})();</script></body></html>
