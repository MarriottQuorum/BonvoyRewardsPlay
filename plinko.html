<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Plinko</title>
<style>
:root{--gold:#d4af37;--gold2:#f1df93;--text:#f7f3ea;--muted:#d0c7b7}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 10%, rgba(212,175,55,.14), transparent 26%),linear-gradient(180deg,#121212 0%,#040404 100%);overflow:hidden}.screen{min-height:100%;padding:10px;display:grid;place-items:center}.frame{width:min(96vw,820px);height:min(96vh,1480px);border-radius:28px;border:1px solid rgba(212,175,55,.34);box-shadow:0 0 0 2px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.12),inset 0 0 90px rgba(212,175,55,.05);background:radial-gradient(circle at 50% 7%, rgba(212,175,55,.11), transparent 24%),linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),#060606;position:relative;overflow:hidden;padding:14px 14px 18px;display:grid;grid-template-rows:auto 1fr auto}.frame:before{content:'';position:absolute;inset:8px;border-radius:22px;border:1px solid rgba(212,175,55,.18);pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.25em;text-transform:uppercase;font-size:clamp(12px,1.15vw,18px);margin-bottom:4px}.title{margin:0;line-height:.95;letter-spacing:-.04em;font-size:clamp(44px,6.4vw,84px);font-weight:900}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg,#1a1a1a,#0d0d0d);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;font-size:clamp(14px,1.35vw,22px);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}.main{display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;gap:10px}.drop-btn{border:none;border-radius:999px;background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);color:#111;font-weight:900;letter-spacing:-.03em;font-size:clamp(24px,4vw,42px);width:min(30vw,210px);height:min(12vw,88px);min-width:150px;min-height:64px;box-shadow:0 0 28px rgba(212,175,55,.4), inset 0 2px 10px rgba(255,255,255,.45), 0 10px 30px rgba(0,0,0,.45);cursor:pointer}.board-wrap{width:min(88vw,700px);height:min(67vh,980px);position:relative;display:grid;grid-template-rows:1fr auto;gap:10px;align-items:end}.drop-zone{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #fff2b0, #d4af37 56%, #7f5e12 100%);box-shadow:0 0 14px rgba(212,175,55,.4);z-index:5}.playfield{position:relative;border-radius:28px 28px 20px 20px;background:radial-gradient(circle at 50% 18%, rgba(212,175,55,.08), transparent 28%), linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), #0b0b0b;border:1px solid rgba(212,175,55,.2);box-shadow:inset 0 0 30px rgba(212,175,55,.05), 0 0 24px rgba(0,0,0,.3);overflow:hidden;min-height:560px}canvas{width:100%;height:100%;display:block}.buckets{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:-6px}.bucket{border-radius:18px;min-height:96px;border:1px solid rgba(212,175,55,.22);box-shadow:inset 0 0 16px rgba(255,255,255,.04), 0 0 18px rgba(0,0,0,.3);display:grid;place-items:center;padding:8px 6px;text-align:center;font-weight:800;color:#fff;line-height:1.04;font-size:clamp(12px,1.25vw,18px)}.bucket .i{width:28px;height:28px;color:#f1df93;margin:0 auto 4px}.accent-blue{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#1a4d9e,#122a56)}.accent-teal{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#1a7b86,#103d43)}.accent-amber{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#a4661f,#5b340c)}.accent-plum{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#7d36a0,#48205d)}.accent-emerald{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#1c6f55,#103b2f)}.accent-gold{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg,#a78320,#5d4610)}.status{text-align:center}.mini{color:var(--gold);font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:clamp(11px,1vw,16px);margin-bottom:4px}.headline{font-size:clamp(34px,5.7vw,74px);font-weight:900;line-height:.92;margin:0 12px;text-shadow:0 3px 12px rgba(0,0,0,.45)}.sub{color:var(--muted);font-size:clamp(15px,1.8vw,26px);margin-top:10px}.footer{display:grid;justify-items:center;gap:10px;padding-bottom:2px}.footer img{max-width:min(60vw,420px);width:100%;height:auto;opacity:.96}.footer-note{font-size:clamp(12px,1.15vw,18px);color:#d6d0c3;text-align:center}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;padding:28px;z-index:40}.overlay.show{display:flex}.overlay-card{width:min(90%, 920px);border-radius:34px;border:1px solid rgba(212,175,55,.36);background:radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%), linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), #080808;box-shadow:0 0 0 1px rgba(212,175,55,.08) inset,0 0 40px rgba(212,175,55,.16);padding:42px 28px;text-align:center;position:relative;overflow:hidden}.overlay-icon{width:92px;height:92px;margin:0 auto 18px;color:var(--gold2)}.winner{font-size:clamp(48px,10vw,142px);font-weight:900;line-height:.88;margin:0;letter-spacing:-.04em;text-shadow:0 0 18px rgba(255,245,200,.18)}.congrats{color:var(--gold2);font-size:clamp(24px,3.1vw,48px);font-weight:900;letter-spacing:.26em;text-transform:uppercase;margin-top:14px}.prize{font-size:clamp(34px,6vw,84px);font-weight:900;line-height:1;margin-top:24px}.returning{color:#ddd5c9;font-size:clamp(18px,2.2vw,30px);margin-top:18px}.confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:100}.confetti{position:absolute;top:-20px;width:10px;height:18px;border-radius:3px;opacity:.9;animation:fall linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(720deg);opacity:.92}}svg{width:100%;height:100%}
</style></head><body>
<div class="screen"><div class="frame"><div class="top"><div><div class="eyebrow">Bonvoy Rewards Play</div><h1 class="title">Plinko</h1></div><div class="controls"><button class="btn" id="homeBtn">Home</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="fsBtn">Full Screen</button></div></div><div class="main"><button class="drop-btn" id="dropBtn">DROP</button><div class="board-wrap"><div class="drop-zone"></div><div class="playfield"><canvas id="board"></canvas></div><div class="buckets" id="buckets"></div></div><div class="status"><div class="mini">Prize Drop</div><div id="headline" class="headline">Tap drop to begin</div><div id="sub" class="sub">Single ball · equal buckets · center hits less often</div></div></div><div class="footer"><img src="BONVOY_LOGO_2C_REV_RGB.png" alt="Marriott Bonvoy"><div id="footerNote" class="footer-note">Ready to play</div></div><div id="overlay" class="overlay"><div class="overlay-card"><div id="overlayIcon" class="overlay-icon"></div><h2 class="winner">WINNER</h2><div class="congrats">Congratulations</div><div id="overlayPrize" class="prize">Prize</div><div class="returning" data-return-text>Returning in 6s</div></div></div></div></div>
<script>
const PRIZE_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";const SETTINGS_KEY='bonvoyRewardsPlaySettingsV2';const DEFAULT_SETTINGS={soundOn:true,popupSeconds:6,afterWinAction:'menu',luckyLoopRandomPath:false};function getSettings(){try{return Object.assign({},DEFAULT_SETTINGS,JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'))}catch{return {...DEFAULT_SETTINGS}}}function parseCsvLine(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i],n=line[i+1];if(ch==='"'){if(q&&n==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){r.push(c.trim());c=''}else c+=ch}r.push(c.trim());return r}function normalize(s){return String(s||'').trim().toLowerCase()}function shortenPrize(label){return String(label).replace(/\bPoints\b/ig,'Pts').replace(/\bBreakfast for Two\b/ig,'Breakfast x2').replace(/\bGift Shop Snack\/Drink\b/ig,'Gift Shop').replace(/\bLate Checkout\b/ig,'Late Check-out').replace(/\s+/g,' ').trim()}function inferIconKey(label){const s=normalize(label);if(s.includes('point'))return'points';if(s.includes('appetizer')||s.includes('dining')||s.includes('dessert'))return'dining';if(s.includes('drink')||s.includes('voucher')||s.includes('bar'))return'drink';if(s.includes('coffee')||s.includes('starbucks'))return'coffee';if(s.includes('breakfast'))return'breakfast';if(s.includes('parking'))return'parking';if(s.includes('club'))return'mclub';if(s.includes('upgrade')||s.includes('suite'))return'upgrade';if(s.includes('gift')||s.includes('snack box'))return'gift';if(s.includes('spin again')||s.includes('double'))return'bonus';if(s.includes('surprise')||s.includes('mystery'))return'surprise';return'star'}function inferAccent(label){const s=normalize(label);if(s.includes('point'))return'blue';if(s.includes('appetizer')||s.includes('dining'))return'teal';if(s.includes('drink')||s.includes('coffee')||s.includes('breakfast')||s.includes('dessert'))return'amber';if(s.includes('parking'))return'emerald';if(s.includes('club')||s.includes('upgrade')||s.includes('suite'))return'gold';if(s.includes('spin again')||s.includes('double'))return'plum';return'blue'}async function loadPrizeMaster(){const fb=['500 Points','Free Appetizer','Late Checkout','Starbucks Drink','Free Parking','Breakfast for Two','2,500 Points'].map(label=>({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)}));try{const res=await fetch(PRIZE_CSV,{cache:'no-store'});const txt=await res.text();const lines=txt.replace(/^\uFEFF/,'').trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return fb;const headers=parseCsvLine(lines[0]).map(normalize);const iActive=headers.indexOf('active'),iLabel=headers.indexOf('prize label');const out=[];for(const line of lines.slice(1)){const cols=parseCsvLine(line);const active=iActive>=0?normalize(cols[iActive]):'yes';const label=(cols[iLabel>=0?iLabel:1]||cols[0]||'').trim();if(!label)continue;if(iActive>=0&&!['yes','true','1','y'].includes(active))continue;out.push({label,short:shortenPrize(label),icon:inferIconKey(label),accent:inferAccent(label)})}return (out.length?out:fb).slice(0,7)}catch{return fb}}function fullScreenToggle(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}function iconSvg(key){const common='viewBox="0 0 64 64" aria-hidden="true"';const i={points:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="18" rx="16" ry="8"/><path d="M16 18v18c0 4.4 7.2 8 16 8s16-3.6 16-8V18"/><path d="M16 27c0 4.4 7.2 8 16 8s16-3.6 16-8"/></g></svg>`,star:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" d="M32 9l6.7 13.6L54 25l-11 10.7 2.6 15.3L32 44l-13.6 7 2.6-15.3L10 25l15.3-2.4z"/></svg>`,dining:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v22M15 10v10M20 20h-5M25 10v10"/><path d="M43 10c4 6 4 12 0 18v26"/><path d="M20 32v22"/></g></svg>`,drink:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14h32l-8 14H24z"/><path d="M32 28v16"/><path d="M24 50h16"/><path d="M44 14l6-6"/></g></svg>`,coffee:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 22h26v14a10 10 0 0 1-10 10H26a10 10 0 0 1-10-10z"/><path d="M42 25h4a7 7 0 0 1 0 14h-4"/><path d="M22 12c0 4 4 4 4 8M30 12c0 4 4 4 4 8"/></g></svg>`,breakfast:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 42c5-12 27-12 32 0"/><path d="M12 42h40"/><path d="M25 28a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/><path d="M40 30c5 0 8-3.4 8-8"/></g></svg>`,parking:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="10" width="36" height="44" rx="6"/><path d="M25 44V20h11a7 7 0 0 1 0 14H25"/></g></svg>`,mclub:`<svg ${common}><path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M12 46h40l-4-24-12 10-8-14-8 14-8-10z"/></svg>`,upgrade:`<svg ${common}><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 42l12-20 12 20"/><path d="M32 20v24"/><path d="M48 16l4-4m0 0l4 4m-4-4v12"/></g></svg>`};return i[key]||i.star}function confettiBurst(target){const wrap=document.createElement('div');wrap.className='confetti-wrap';for(let i=0;i<80;i++){const p=document.createElement('span');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.8+Math.random()*1.1)+'s';p.style.background=['#d4af37','#f1df93','#b07a1c','#1d5e90','#1f766a','#7b38a3'][Math.floor(Math.random()*6)];wrap.appendChild(p)}target.appendChild(wrap);setTimeout(()=>wrap.remove(),3400)}function scheduleAfterWin(closeFn){const s=getSettings();let r=Math.max(1,Number(s.popupSeconds)||6);const el=document.querySelector('[data-return-text]');if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`;const t=setInterval(()=>{r--;if(r<=0){clearInterval(t);closeFn()}else if(el)el.textContent=`${s.afterWinAction==='menu'?'Returning to menu':'Returning to game'} in ${r}s`},1000);return t}
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),bucketsEl=document.getElementById('buckets'),headline=document.getElementById('headline'),sub=document.getElementById('sub'),footerNote=document.getElementById('footerNote'),overlay=document.getElementById('overlay'),overlayIcon=document.getElementById('overlayIcon'),overlayPrize=document.getElementById('overlayPrize');let w=0,h=0,pegs=[],prizes=[],ball=null,anim=null,dropping=false,winTimer=null;function resize(){const rect=canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);w=rect.width;h=rect.height;buildPegs();draw()}function buildPegs(){pegs=[];const rows=9,cols=8,gapX=w/(cols+1),gapY=(h-150)/(rows+1);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const offset=(r%2===0)?gapX/2:0,x=gapX+c*gapX+offset,y=80+gapY+r*gapY;if(x>26&&x<w-26)pegs.push({x,y,r:6})}}function weightedTargetIndex(){const weights=[16,16,16,4,16,16,16],total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<weights.length;i++){if(r<weights[i])return i;r-=weights[i]}return 0}function renderBuckets(){bucketsEl.innerHTML='';prizes.forEach(p=>{const div=document.createElement('div');div.className='bucket accent-'+p.accent;div.innerHTML='<div><div class="i">'+iconSvg(p.icon)+'</div><div>'+shortenPrize(p.label)+'</div></div>';bucketsEl.appendChild(div)})}function dropBall(){if(dropping)return;dropping=true;const target=weightedTargetIndex(),bw=w/7;ball={x:w/2,y:22,vx:0,vy:1.6,r:10,targetX:target*bw+bw/2};headline.textContent='Dropping…';sub.textContent='Watch the path';footerNote.textContent='Ball in motion';step()}function step(){if(!ball)return;ball.vy+=0.18;ball.x+=ball.vx;ball.y+=ball.vy;for(const peg of pegs){const dx=ball.x-peg.x,dy=ball.y-peg.y,dist=Math.hypot(dx,dy),minDist=ball.r+peg.r;if(dist<minDist){const angle=Math.atan2(dy,dx),push=minDist-dist;ball.x+=Math.cos(angle)*push;ball.y+=Math.sin(angle)*push;ball.vx+=Math.cos(angle)*1.35+(Math.random()-.5)*.7;ball.vy*=.72}}const steer=(ball.targetX-ball.x)*0.0009;ball.vx+=steer;ball.vx*=0.992;if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-.55}if(ball.x>w-ball.r){ball.x=w-ball.r;ball.vx*=-.55}draw();if(ball.y>h-62){const idx=Math.max(0,Math.min(6,Math.floor(ball.x/(w/7))));showWinner(prizes[idx]);ball=null;dropping=false;return}anim=requestAnimationFrame(step)}function draw(){ctx.clearRect(0,0,w,h);const glow=ctx.createRadialGradient(w/2,80,10,w/2,180,360);glow.addColorStop(0,'rgba(212,175,55,.12)');glow.addColorStop(1,'rgba(212,175,55,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(const peg of pegs){const g=ctx.createRadialGradient(peg.x,peg.y,1,peg.x,peg.y,11);g.addColorStop(0,'rgba(244,223,138,.55)');g.addColorStop(1,'rgba(212,175,55,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(peg.x,peg.y,11,0,Math.PI*2);ctx.fill();const pg=ctx.createRadialGradient(peg.x-2,peg.y-2,1,peg.x,peg.y,peg.r+1);pg.addColorStop(0,'#fff2b0');pg.addColorStop(.45,'#d4af37');pg.addColorStop(1,'#7d5d15');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(peg.x,peg.y,peg.r,0,Math.PI*2);ctx.fill()}if(ball){const bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r+2);bg.addColorStop(0,'#fff2b0');bg.addColorStop(.42,'#e6c95a');bg.addColorStop(1,'#8a6716');ctx.fillStyle=bg;ctx.shadowColor='rgba(212,175,55,.45)';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}function showWinner(prize){overlayIcon.innerHTML=iconSvg(prize.icon);overlayPrize.textContent=prize.label;overlay.classList.add('show');confettiBurst(overlay.querySelector('.overlay-card'));headline.textContent=prize.label;sub.textContent='Winner selected';footerNote.textContent='Tap anywhere to continue';if(winTimer)clearInterval(winTimer);winTimer=scheduleAfterWin(closeWinner)}function closeWinner(){if(winTimer)clearInterval(winTimer);overlay.classList.remove('show');if(getSettings().afterWinAction==='menu')location.href='index.html';else resetGame()}function resetGame(){if(anim)cancelAnimationFrame(anim);ball=null;dropping=false;headline.textContent='Tap drop to begin';sub.textContent='Single ball · equal buckets · center hits less often';footerNote.textContent='Ready to play';draw()}document.getElementById('dropBtn').onclick=dropBall;document.getElementById('homeBtn').onclick=()=>location.href='index.html';document.getElementById('resetBtn').onclick=resetGame;document.getElementById('fsBtn').onclick=fullScreenToggle;overlay.onclick=closeWinner;window.addEventListener('resize',resize);(async()=>{prizes=await loadPrizeMaster();prizes=prizes.slice(0,7);renderBuckets();resize()})();
</script></body></html>
