<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plinko</title>
  <style>
    :root{
      --bg:#060606;
      --panel:#101010;
      --gold:#d4af37;
      --gold2:#f1df93;
      --text:#f5f0e6;
      --muted:#c9bfaa;
      --blue:#173e8c;
      --teal:#155f67;
      --amber:#8e5311;
      --plum:#6b2f7f;
      --emerald:#185b43;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 10%, rgba(212,175,55,.14), transparent 25%),
        linear-gradient(180deg, #111 0%, #040404 100%);
      overflow:hidden;
    }
    .screen{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:10px;
    }
    .frame{
      width:min(96vw, 820px);
      height:min(96vh, 1480px);
      border-radius:28px;
      border:1px solid rgba(212,175,55,.32);
      box-shadow:
        0 0 0 2px rgba(212,175,55,.08) inset,
        0 0 36px rgba(212,175,55,.10),
        inset 0 0 80px rgba(212,175,55,.05);
      background:
        radial-gradient(circle at 50% 8%, rgba(212,175,55,.10), transparent 22%),
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0)),
        #050505;
      position:relative;
      overflow:hidden;
      padding:14px 14px 18px;
      display:grid;
      grid-template-rows:auto 1fr auto;
    }
    .frame::before{
      content:"";
      position:absolute; inset:8px;
      border-radius:22px;
      border:1px solid rgba(212,175,55,.18);
      pointer-events:none;
    }
    .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      z-index:2;
    }
    .eyebrow{
      color:var(--gold);
      font-weight:800;
      letter-spacing:.24em;
      text-transform:uppercase;
      font-size:clamp(12px,1.2vw,18px);
      margin-bottom:4px;
    }
    h1{
      margin:0;
      font-weight:900;
      line-height:.95;
      letter-spacing:-.04em;
      font-size:clamp(46px,6.6vw,86px);
    }
    .controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg, #1a1a1a, #0d0d0d);
      color:#fff;
      border-radius:16px;
      padding:12px 16px;
      font-weight:800;
      font-size:clamp(14px,1.4vw,22px);
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.35);
    }
    .main{
      display:grid;
      grid-template-rows:auto 1fr auto;
      justify-items:center;
      align-items:center;
      gap:10px;
      padding:8px 0;
    }
    .drop-btn{
      border:none;
      border-radius:999px;
      background:radial-gradient(circle at 34% 30%, #fff2b0 0%, #efcf59 34%, #c99a19 78%, #9a7410 100%);
      color:#111;
      font-weight:900;
      letter-spacing:-.03em;
      font-size:clamp(24px,4vw,42px);
      width:min(30vw, 210px);
      height:min(12vw, 88px);
      min-width:150px;
      min-height:64px;
      box-shadow:
        0 0 28px rgba(212,175,55,.4),
        inset 0 2px 10px rgba(255,255,255,.45),
        0 10px 30px rgba(0,0,0,.45);
      cursor:pointer;
    }
    .board-wrap{
      width:min(86vw, 680px);
      height:min(66vh, 980px);
      position:relative;
      display:grid;
      grid-template-rows:1fr auto;
      gap:10px;
      align-items:end;
    }
    .drop-zone{
      position:absolute;
      top:8px;
      left:50%;
      transform:translateX(-50%);
      width:38px;
      height:38px;
      border-radius:50%;
      background:radial-gradient(circle at 30% 30%, #fff2b0, #d4af37 56%, #7f5e12 100%);
      box-shadow:0 0 14px rgba(212,175,55,.4);
      z-index:5;
    }
    .playfield{
      position:relative;
      border-radius:28px 28px 20px 20px;
      background:
        radial-gradient(circle at 50% 18%, rgba(212,175,55,.08), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)),
        #0b0b0b;
      border:1px solid rgba(212,175,55,.2);
      box-shadow:
        inset 0 0 30px rgba(212,175,55,.05),
        0 0 24px rgba(0,0,0,.3);
      overflow:hidden;
      min-height:560px;
    }
    canvas{
      width:100%;
      height:100%;
      display:block;
    }
    .buckets{
      display:grid;
      grid-template-columns:repeat(7, 1fr);
      gap:8px;
      margin-top:-6px;
    }
    .bucket{
      border-radius:18px;
      min-height:96px;
      border:1px solid rgba(212,175,55,.22);
      box-shadow:
        inset 0 0 16px rgba(255,255,255,.04),
        0 0 18px rgba(0,0,0,.3);
      display:grid;
      place-items:center;
      padding:8px 6px;
      text-align:center;
      font-weight:800;
      color:#fff;
      line-height:1.04;
      font-size:clamp(12px,1.25vw,18px);
    }
    .bucket[data-tone="blue"]{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg, #1a4d9e, #122a56)}
    .bucket[data-tone="teal"]{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg, #1a7b86, #103d43)}
    .bucket[data-tone="amber"]{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg, #a4661f, #5b340c)}
    .bucket[data-tone="plum"]{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg, #7d36a0, #48205d)}
    .bucket[data-tone="emerald"]{background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.12), transparent 35%), linear-gradient(180deg, #1c6f55, #103b2f)}
    .status{text-align:center}
    .mini{
      color:var(--gold);
      font-weight:800;
      letter-spacing:.28em;
      text-transform:uppercase;
      font-size:clamp(11px, 1vw, 16px);
      margin-bottom:4px;
    }
    .headline{
      font-size:clamp(34px, 5.7vw, 74px);
      font-weight:900;
      line-height:.92;
      margin:0 12px;
      text-shadow:0 3px 12px rgba(0,0,0,.45);
    }
    .sub{
      color:var(--muted);
      font-size:clamp(15px,1.8vw,26px);
      margin-top:10px;
    }
    .footer{
      display:grid;
      justify-items:center;
      gap:10px;
      padding-bottom:2px;
    }
    .footer img{max-width:min(60vw,420px); width:100%; height:auto; opacity:.96}
    .footer-note{
      font-size:clamp(12px,1.15vw,18px);
      color:#d6d0c3;
      text-align:center;
    }
    .overlay{
      position:absolute; inset:0;
      background:rgba(0,0,0,.86);
      display:none;
      align-items:center;
      justify-content:center;
      padding:28px;
      z-index:30;
    }
    .overlay.show{display:flex}
    .overlay-card{
      width:min(90%, 920px);
      border-radius:34px;
      border:1px solid rgba(212,175,55,.36);
      background:
        radial-gradient(circle at 50% 22%, rgba(212,175,55,.18), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)),
        #080808;
      box-shadow:
        0 0 0 1px rgba(212,175,55,.08) inset,
        0 0 40px rgba(212,175,55,.16);
      padding:42px 28px;
      text-align:center;
    }
    .winner{
      font-size:clamp(48px,10vw,142px);
      font-weight:900;
      line-height:.88;
      margin:0;
      letter-spacing:-.04em;
      text-shadow:0 0 18px rgba(255,245,200,.18);
    }
    .congrats{
      color:var(--gold2);
      font-size:clamp(24px,3.1vw,48px);
      font-weight:900;
      letter-spacing:.26em;
      text-transform:uppercase;
      margin-top:14px;
    }
    .prize{
      font-size:clamp(34px,6vw,84px);
      font-weight:900;
      line-height:1;
      margin-top:24px;
    }
    .returning{
      color:#ddd5c9;
      font-size:clamp(18px,2.2vw,30px);
      margin-top:18px;
    }
  </style>
</head>
<body>
<div class="screen">
  <div class="frame">
    <div class="top">
      <div>
        <div class="eyebrow">Bonvoy Rewards Play</div>
        <h1>Plinko</h1>
      </div>
      <div class="controls">
        <button class="btn" id="homeBtn">Home</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="fsBtn">Full Screen</button>
      </div>
    </div>

    <div class="main">
      <button class="drop-btn" id="dropBtn">DROP</button>

      <div class="board-wrap">
        <div class="drop-zone"></div>
        <div class="playfield">
          <canvas id="board"></canvas>
        </div>
        <div class="buckets" id="buckets"></div>
      </div>

      <div class="status">
        <div class="mini">Prize Drop</div>
        <div id="headline" class="headline">Tap drop to begin</div>
        <div id="sub" class="sub">Single ball · equal buckets · center hits less often</div>
      </div>
    </div>

    <div class="footer">
      <img alt="Marriott Bonvoy" src="BONVOY_LOGO_2C_REV_RGB.png" onerror="this.style.display='none'">
      <div id="footerNote" class="footer-note">Ready to play</div>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <h2 class="winner">WINNER</h2>
        <div class="congrats">Congratulations</div>
        <div id="overlayPrize" class="prize">Prize</div>
        <div class="returning">Tap to continue</div>
      </div>
    </div>
  </div>
</div>

<script>
  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSghLINBiTIV-kBxQ1W5tHwMFTdJg_8SS5ut_EcagFvcszr0FLLUmV8k5gQUR7YKA/pub?gid=966349411&single=true&output=csv";
  const DEFAULT_PRIZES = ["500 Points","Free Appetizer","Late Checkout","Starbucks Drink","Free Parking","Breakfast for Two","2,500 Points"];
  const TONES = ["blue","teal","amber","plum","emerald","blue","teal"];

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const bucketsEl = document.getElementById("buckets");
  const dropBtn = document.getElementById("dropBtn");
  const headline = document.getElementById("headline");
  const sub = document.getElementById("sub");
  const footerNote = document.getElementById("footerNote");
  const overlay = document.getElementById("overlay");
  const overlayPrize = document.getElementById("overlayPrize");

  let w = 0, h = 0;
  let pegs = [];
  let prizes = [];
  let bucketRanges = [];
  let ball = null;
  let anim = null;
  let dropping = false;

  function parseCsvLine(line){
    const result = [];
    let current = "", inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i], next = line[i+1];
      if(ch === '"'){
        if(inQuotes && next === '"'){ current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch === ',' && !inQuotes){
        result.push(current.trim()); current = "";
      } else current += ch;
    }
    result.push(current.trim());
    return result;
  }

  async function loadPrizes(){
    try{
      const res = await fetch(SHEET_URL, {cache:'no-store'});
      const text = await res.text();
      const lines = text.replace(/^\uFEFF/, "").trim().split(/\r?\n/).filter(Boolean);
      const rows = lines[0] && /active|prize label|label/i.test(lines[0]) ? lines.slice(1) : lines;
      const pulled = [];
      for(const row of rows){
        const cols = parseCsvLine(row);
        const active = (cols[0] || "").toLowerCase();
        const label = (cols[1] || cols[0] || "").trim();
        if((active === "yes" || active === "true" || active === "1" || !cols[1]) && label){
          pulled.push(label);
        }
      }
      prizes = (pulled.length ? pulled : DEFAULT_PRIZES).slice(0,7);
    } catch(err){
      prizes = DEFAULT_PRIZES.slice();
    }
    while(prizes.length < 7) prizes.push(DEFAULT_PRIZES[prizes.length % DEFAULT_PRIZES.length]);
    prizes = prizes.slice(0,7);
    renderBuckets();
    resize();
  }

  function renderBuckets(){
    bucketsEl.innerHTML = "";
    prizes.forEach((p, i) => {
      const div = document.createElement("div");
      div.className = "bucket";
      div.dataset.tone = TONES[i % TONES.length];
      div.textContent = shorten(p);
      bucketsEl.appendChild(div);
    });
  }

  function shorten(v){
    return String(v)
      .replace(/\bPoints\b/i, "Pts")
      .replace(/\bfor Two\b/i, "x2")
      .replace(/\bFree\b/i, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    w = rect.width;
    h = rect.height;
    buildPegs();
    buildBuckets();
    draw();
  }

  function buildPegs(){
    pegs = [];
    const rows = 9;
    const cols = 8;
    const gapX = w / (cols + 1);
    const gapY = (h - 150) / (rows + 1);
    for(let r=0; r<rows; r++){
      for(let c=0; c<cols; c++){
        const offset = (r % 2 === 0) ? gapX / 2 : 0;
        const x = gapX + c * gapX + offset;
        const y = 80 + gapY + r * gapY;
        if(x > 26 && x < w - 26) pegs.push({x, y, r:6});
      }
    }
  }

  function buildBuckets(){
    bucketRanges = [];
    const count = 7;
    const bucketW = w / count;
    for(let i=0; i<count; i++){
      bucketRanges.push({x0:i * bucketW, x1:(i + 1) * bucketW, index:i});
    }
  }

  function weightedTargetIndex(){
    const weights = [16, 16, 16, 4, 16, 16, 16];
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random() * total;
    for(let i=0;i<weights.length;i++){
      if(r < weights[i]) return i;
      r -= weights[i];
    }
    return 0;
  }

  function dropBall(){
    if(dropping) return;
    dropping = true;
    const target = weightedTargetIndex();
    const bucketW = w / 7;
    const targetX = target * bucketW + bucketW / 2;
    ball = {
      x:w/2,
      y:22,
      vx:0,
      vy:1.6,
      r:10,
      targetX
    };
    headline.textContent = "Dropping…";
    sub.textContent = "Watch the path";
    footerNote.textContent = "Ball in motion";
    step();
  }

  function step(){
    if(!ball) return;

    ball.vy += 0.18;
    ball.x += ball.vx;
    ball.y += ball.vy;

    for(const peg of pegs){
      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const dist = Math.hypot(dx, dy);
      const minDist = ball.r + peg.r;
      if(dist < minDist){
        const angle = Math.atan2(dy, dx);
        const push = minDist - dist;
        ball.x += Math.cos(angle) * push;
        ball.y += Math.sin(angle) * push;
        ball.vx += Math.cos(angle) * 1.4 + (Math.random() - 0.5) * 0.7;
        ball.vy *= 0.72;
      }
    }

    // steer gently toward target
    const steer = (ball.targetX - ball.x) * 0.0009;
    ball.vx += steer;
    ball.vx *= 0.992;

    if(ball.x < ball.r){ ball.x = ball.r; ball.vx *= -0.55; }
    if(ball.x > w - ball.r){ ball.x = w - ball.r; ball.vx *= -0.55; }

    draw();

    if(ball.y > h - 62){
      const idx = Math.max(0, Math.min(6, Math.floor(ball.x / (w / 7))));
      const prize = prizes[idx] || DEFAULT_PRIZES[idx] || "Prize";
      showWinner(prize);
      ball = null;
      dropping = false;
      return;
    }
    anim = requestAnimationFrame(step);
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);

    // board glow
    const g = ctx.createRadialGradient(w/2, 80, 10, w/2, 180, 360);
    g.addColorStop(0, "rgba(212,175,55,0.12)");
    g.addColorStop(1, "rgba(212,175,55,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // pegs
    for(const peg of pegs){
      const glow = ctx.createRadialGradient(peg.x, peg.y, 1, peg.x, peg.y, 11);
      glow.addColorStop(0, "rgba(244,223,138,0.55)");
      glow.addColorStop(1, "rgba(212,175,55,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, 11, 0, Math.PI * 2);
      ctx.fill();

      const pegGrad = ctx.createRadialGradient(peg.x - 2, peg.y - 2, 1, peg.x, peg.y, peg.r + 1);
      pegGrad.addColorStop(0, "#fff2b0");
      pegGrad.addColorStop(0.45, "#d4af37");
      pegGrad.addColorStop(1, "#7d5d15");
      ctx.fillStyle = pegGrad;
      ctx.beginPath();
      ctx.arc(peg.x, peg.y, peg.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ball
    if(ball){
      const bg = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r + 2);
      bg.addColorStop(0, "#fff2b0");
      bg.addColorStop(0.42, "#e6c95a");
      bg.addColorStop(1, "#8a6716");
      ctx.fillStyle = bg;
      ctx.shadowColor = "rgba(212,175,55,0.45)";
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function showWinner(prize){
    overlayPrize.textContent = prize;
    overlay.classList.add("show");
    headline.textContent = prize;
    sub.textContent = "Winner selected";
    footerNote.textContent = "Tap anywhere to continue";
  }

  function closeWinner(){
    overlay.classList.remove("show");
    headline.textContent = "Tap drop to begin";
    sub.textContent = "Single ball · equal buckets · center hits less often";
    footerNote.textContent = "Ready to play";
  }

  function resetGame(){
    if(anim) cancelAnimationFrame(anim);
    ball = null;
    dropping = false;
    closeWinner();
    draw();
  }

  function toggleFull(){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }

  document.getElementById("dropBtn").addEventListener("click", dropBall);
  document.getElementById("homeBtn").addEventListener("click", () => location.href = "index.html");
  document.getElementById("resetBtn").addEventListener("click", resetGame);
  document.getElementById("fsBtn").addEventListener("click", toggleFull);
  overlay.addEventListener("click", closeWinner);
  window.addEventListener("resize", resize);

  loadPrizes();
</script>
</body>
</html>
